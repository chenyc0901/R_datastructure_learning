<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="寫 R 的 function 指揮機器人：參數、回傳值、區域變數、分解問題，再完成線性搜尋、找最大值、遞迴與氣泡排序。">
<meta property="og:title" content="R 寶的演算法學院">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<title>R 寶的演算法學院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
html{color-scheme:light}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:6px}
.back:hover{color:var(--accent)}
/* Layout: level map strip, then a Karel-style workbench — mission + world on top, R source editor + environment/console below */
:root{
  --bg:#e9edf1; --panel:#fbfcfd; --sunk:#f1f4f7; --ink:#16202b; --muted:#5a6776; --line:#d3dae2;
  --accent:#1d5fae; --accent-ink:#ffffff; --accent-soft:#dde9f7;
  --amber:#e0a422; --amber-soft:#fdf1cf; --ok:#1d8656; --ok-soft:#dcf2e6; --bad:#c0392b; --bad-soft:#fbe3e0;
  --tile:#f4f1e8; --tile2:#ece8dc; --dot:#b9b2a0; --wall:#3a3f4a; --gem:#2fb3a6; --gem-edge:#14776e; --target:#8d97a3;
  --t-kw:#8b2fc9; --t-str:#1d7a3a; --t-num:#b4530a; --t-com:#7f8a96; --t-fn:#1d5fae; --t-op:#a3324b;
  --f-display:"Huninn","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC",system-ui,-apple-system,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Noto Sans TC",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --panel:#161d25; --sunk:#11171e; --ink:#e3e9f0; --muted:#93a1b1; --line:#283340;
    --accent:#6aa5ec; --accent-ink:#0b1622; --accent-soft:#1b2c42;
    --amber:#e9b949; --amber-soft:#3a3018; --ok:#4cc58b; --ok-soft:#163327; --bad:#f07167; --bad-soft:#3a1d1b;
    --tile:#1d252f; --tile2:#19212a; --dot:#3b4756; --wall:#c9d3df; --gem:#45d1c2; --gem-edge:#a6f0e7; --target:#6f7d8d;
    --t-kw:#c792ea; --t-str:#9ccc65; --t-num:#f5a65b; --t-com:#6c7a89; --t-fn:#82b1ff; --t-op:#ff8fa3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#161d25; --sunk:#11171e; --ink:#e3e9f0; --muted:#93a1b1; --line:#283340;
  --accent:#6aa5ec; --accent-ink:#0b1622; --accent-soft:#1b2c42;
  --amber:#e9b949; --amber-soft:#3a3018; --ok:#4cc58b; --ok-soft:#163327; --bad:#f07167; --bad-soft:#3a1d1b;
  --tile:#1d252f; --tile2:#19212a; --dot:#3b4756; --wall:#c9d3df; --gem:#45d1c2; --gem-edge:#a6f0e7; --target:#6f7d8d;
  --t-kw:#c792ea; --t-str:#9ccc65; --t-num:#f5a65b; --t-com:#6c7a89; --t-fn:#82b1ff; --t-op:#ff8fa3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;font-variant-ligatures:none}
textarea,svg text{font-variant-ligatures:none}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:16px}
code,.mono{font-family:var(--f-code);font-size:.92em}
p code,li code,.concept code,.goal code,.result code{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 .3em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
.brand h1{font-family:var(--f-display);font-size:clamp(28px,4.6vw,42px);line-height:1.1;margin:0;letter-spacing:.02em;text-wrap:balance}
.brand h1 .r{display:inline-grid;place-items:center;width:1.15em;height:1.15em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-code);font-weight:600;font-size:.82em;margin-right:.18em;vertical-align:.06em}
.brand p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.stats{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lv{font-family:var(--f-display);font-size:20px}
.xpbar{width:160px;max-width:40vw;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.xptxt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.chipbtn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 12px;font-size:13px}

/* level map */
.mapwrap{overflow-x:auto;padding-bottom:4px}
.map{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.node{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;transition:border-color .15s,background .15s}
.node:hover{border-color:var(--accent)}
.node .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-code);font-size:13px;font-weight:600;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.node .tag{font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap}
.node .stars{font-size:11px;letter-spacing:1px;color:var(--line);line-height:1}
.node .stars .on{color:var(--amber)}
.node[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.node[aria-current="true"] .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.node.done .num{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.node.lv-boss{border-color:var(--bad);background:var(--bad-soft)}
.node.lv-boss .num{background:var(--bad);border-color:var(--bad);color:var(--panel);font-size:15px}
.node.lv-boss .num,.node.bio .num{line-height:1;overflow:hidden}
.node.lv-boss .tag{color:var(--bad)}
.node.lv-boss.done .num{background:var(--amber);border-color:var(--amber)}
.mission.lv-boss .eyebrow{color:var(--bad);font-weight:700}
.mission.lv-boss h2::before{content:'💀 ';color:var(--bad)}
.node.bio{border-color:var(--ok);background:var(--ok-soft)}
.node.bio .num{background:var(--ok);border-color:var(--ok);color:var(--panel);font-size:15px}
.node.bio .tag{color:var(--ok)}
.mission.bio .eyebrow{color:var(--ok);font-weight:700}
.mission.bio h2::before{content:'🧬 '}

/* workbench */
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-areas:"mission side" "code side";grid-template-rows:auto 1fr;gap:16px;align-items:start}
.a-mission{grid-area:mission}.a-side{grid-area:side;gap:16px}.a-world{grid-area:world}.a-info{grid-area:info}.a-stick{gap:10px}.a-code{grid-area:code}.a-env{grid-area:env}
@media (max-width:920px){.bench{grid-template-columns:minmax(0,1fr);grid-template-areas:"mission" "world" "info" "code";grid-template-rows:none}.bench .a-side,.bench .a-stick{display:contents}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.mission h2{font-family:var(--f-display);font-size:28px;margin:2px 0 6px;line-height:1.2;text-wrap:balance}
.goal{margin:0 0 10px;font-weight:500;max-width:62ch}
.concept{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--sunk);font-size:14px}
.concept p{margin:0 0 6px;max-width:65ch}
.concept p:last-child{margin-bottom:0}
.hint{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--amber-soft);font-size:14px}

.pane{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;min-width:0}
.pane-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);letter-spacing:.04em;flex-wrap:wrap}
.pane-h b{color:var(--ink);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.pane-h .acts{display:flex;gap:6px}
.pane-h .acts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:1px 8px;font-size:12px}
.pane-h .acts button:disabled{opacity:.4;cursor:default}

/* world */
.worldpane{overflow:visible}
.worldwrap{padding:46px 14px 12px}
.world{position:relative;margin:0 auto;max-width:100%}
.world svg.map-svg{display:block;width:100%;height:auto}
.world svg.over{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;overflow:visible}
.under-badge{transform-box:fill-box;transform-origin:center;animation:gempop .35s ease-out}
.robot{position:absolute;left:0;top:0;transition:transform var(--dur,.45s) ease-in-out;z-index:2;pointer-events:none}
.robot.instant,.robot.instant .rb-rot{transition:none}
.rb-rot{width:100%;height:100%;display:grid;place-items:center;transition:transform var(--dur,.45s) ease-in-out}
.rb-svg{width:82%;height:82%;overflow:visible}
.rb-body{fill:var(--accent)}
.rb-face{fill:var(--panel)}
.rb-eye{fill:var(--ink)}
.rb-ant{fill:var(--amber)}
.rb-foot{fill:var(--wall)}
.rb-svg .ft{transform-box:fill-box;transform-origin:center}
.robot.walking .f1{animation:foot calc(var(--dur,.45s)/2) ease-in-out infinite alternate}
.robot.walking .f2{animation:foot calc(var(--dur,.45s)/2) ease-in-out infinite alternate-reverse}
@keyframes foot{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
.rb-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleX(1)}96%{transform:scaleX(.15)}}
.robot.bonk .rb-svg{animation:bonk .4s ease-out}
@keyframes bonk{25%{transform:translateX(10%)}50%{transform:translateX(-6%)}75%{transform:translateX(4%)}}
.robot.hop .rb-svg{animation:hop .5s ease-out}
@keyframes hop{40%{transform:scale(1.28)}70%{transform:scale(.95)}}
.robot.party .rb-svg{animation:spin 1s ease-in-out}
@keyframes spin{50%{transform:scale(1.3) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}
.robot.sad .rb-body{fill:var(--bad)}
.bubble{position:absolute;bottom:88%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:9px;padding:1px 8px;font-family:var(--f-code);font-size:12px;line-height:1.6;box-shadow:0 2px 0 var(--ink);opacity:0;transition:opacity .15s;z-index:3}
.bubble.show{opacity:1}
.bubble.l{left:0;transform:none}.bubble.r{left:auto;right:0;transform:none}
.bubble.t{border-color:var(--ok);box-shadow:0 2px 0 var(--ok)}
.bubble.f{border-color:var(--bad);box-shadow:0 2px 0 var(--bad)}
.gem-pop{transform-box:fill-box;transform-origin:center;animation:gempop .35s ease-out}
@keyframes gempop{from{transform:scale(0)}70%{transform:scale(1.25)}to{transform:scale(1)}}
.gem-poof{transform-box:fill-box;transform-origin:center;animation:poof .45s ease-out forwards}
@keyframes poof{to{transform:translateY(-30px) scale(.4);opacity:0}}
.wstatus{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wstatus b{color:var(--ink);font-family:var(--f-code);font-weight:600}

/* editor */
.editor{display:grid;grid-template-columns:44px minmax(0,1fr);font-family:var(--f-code);font-size:14px;line-height:1.7;background:var(--panel)}
.gutter{padding:10px 10px 10px 0;text-align:right;color:var(--t-com);font-size:12px;line-height:1.7*14px;user-select:none;background:var(--sunk);border-right:1px solid var(--line);white-space:pre}
.gutter{line-height:23.8px}
#ed{width:100%;min-height:200px;resize:none;border:0;outline:none;background:transparent;color:var(--ink);font:inherit;font-size:14px;line-height:23.8px;padding:10px 12px;white-space:pre;overflow-x:auto;overflow-y:hidden;tab-size:2}
#ed:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent-soft)}
.codeview{position:relative;font-family:var(--f-code);font-size:14px;line-height:23.8px;padding-block:10px;overflow:auto;max-height:min(62vh,560px);overscroll-behavior:contain;cursor:text}
/* long programs: the code box scrolls by itself, and the world column stays in view */
/* target result, Environment and Console share one tabbed panel under the world */
.infopane .tabs{display:flex;gap:2px;padding:3px 6px 0;background:var(--sunk);border-bottom:1px solid var(--line)}
.infopane .tabs button{position:relative;border:0;background:transparent;padding:6px 12px;font-size:12.5px;letter-spacing:.03em;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.infopane .tabs button:hover{color:var(--ink)}
.infopane .tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.infopane .tabs button.new::after{content:"";position:absolute;top:5px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.tabp{height:150px;overflow:auto;overscroll-behavior:contain}
.tabp .console{min-height:100%;max-height:none;overflow:visible}
.tabp .env thead th{position:sticky;top:0;background:var(--panel);z-index:1}
@media (max-width:920px){.tabp{height:auto;max-height:280px}}
/* world + target result stay pinned together while a long program scrolls by */
@media (min-width:921px){.a-side{align-self:stretch}.a-stick{position:sticky;top:0;z-index:3;background:var(--bg);padding-block:6px 10px;margin-top:-6px}}
@media (max-width:920px){.codeview{max-height:42vh}}
.ln{display:grid;grid-template-columns:44px max-content;white-space:pre;min-width:max-content}
.ln .no{text-align:right;padding-right:10px;color:var(--t-com);font-size:12px;user-select:none}
.ln code{font-size:inherit;padding:0 16px 0 12px}
.ln.cur{background:var(--amber-soft);box-shadow:inset 3px 0 0 var(--amber)}
.ln.errl{background:var(--bad-soft);box-shadow:inset 3px 0 0 var(--bad)}
.ln.cur .no::before{content:"▶ ";color:var(--ok);font-size:10px}
.t-kw{color:var(--t-kw);font-weight:600}.t-str{color:var(--t-str)}.t-num{color:var(--t-num)}.t-com{color:var(--t-com);font-style:italic}.t-fn{color:var(--t-fn)}.t-op{color:var(--t-op)}
.snips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;border-top:1px solid var(--line);background:var(--sunk)}
.snips span{font-size:11px;color:var(--muted);align-self:center;margin-right:2px}
.snip{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:1px 7px;font-family:var(--f-code);font-size:12px}
.snip:hover{border-color:var(--accent)}
.snip.ctl{color:var(--t-kw)}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:14px;line-height:1.4;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.go{background:var(--ok);border-color:var(--ok);color:var(--panel);font-weight:600;padding-inline:18px}
.speed{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-left:auto}
.speed input{width:90px;accent-color:var(--accent)}
.result{border-radius:8px;padding:10px 12px;font-size:14px}
.result.no{background:var(--bad-soft)}
.result.ok{background:var(--ok-soft)}
.result .btn{margin-top:8px}

.env{width:100%;border-collapse:collapse;font-size:13px}
.env th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:4px 10px;border-bottom:1px solid var(--line)}
.env td{padding:4px 10px;border-bottom:1px solid var(--line);font-family:var(--f-code);font-variant-numeric:tabular-nums}
.env tr:last-child td{border-bottom:0}
.env .empty{color:var(--muted);font-family:var(--f-body)}
.console{margin:0;padding:10px 12px;font-family:var(--f-code);font-size:13px;line-height:1.6;min-height:70px;max-height:180px;overflow:auto;white-space:pre-wrap;background:var(--sunk)}
.console .prompt{color:var(--accent)}
.console .err{color:var(--bad)}
.console .good{color:var(--ok)}

/* modal */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.card{background:var(--panel);border-radius:16px;padding:24px;max-width:420px;width:100%;text-align:center;border:1px solid var(--line);animation:rise .3s ease-out}
.card h3{font-family:var(--f-display);font-size:34px;margin:0}
.bigstars{display:flex;justify-content:center;gap:10px;margin:14px 0 6px}
.bigstars div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);width:96px}
.bigstars i{font-style:normal;font-size:40px;line-height:1;color:var(--line)}
.bigstars .on i{color:var(--amber);animation:starin .5s ease-out backwards}
.bigstars div:nth-child(2) i{animation-delay:.15s}.bigstars div:nth-child(3) i{animation-delay:.3s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}}
.card .controls{justify-content:center;margin-top:14px}

/* quiz (boss) */
.boss{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.boss h3{font-family:var(--f-display);font-size:24px;margin:0 0 4px}
.boss .bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;color:var(--muted)}
.hearts{color:var(--bad);letter-spacing:2px;font-size:18px}
.hearts .lost{color:var(--line)}
.q{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.q .qt{font-weight:500}
.codeblk{margin:0;font-family:var(--f-code);font-size:13px;line-height:1.6;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:pre}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;font-family:var(--f-code);font-size:13px;white-space:pre-wrap}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.why.ok{background:var(--ok-soft)}.why.no{background:var(--bad-soft)}
.big{font-family:var(--f-display);font-size:52px;line-height:1;margin:6px 0}
.rank{font-family:var(--f-display);font-size:24px;color:var(--accent)}
.rules{margin:0;padding-left:1.2em}

.foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}
.linkbtn.armed{color:var(--bad)}
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:30;pointer-events:none}
.toast{background:var(--ink);color:var(--panel);padding:7px 14px;border-radius:99px;font-size:14px;font-weight:500;animation:rise .3s ease-out}
.toast.gold{background:var(--amber);color:#1c1405}

<script>
/* ================= R-subset interpreter + Karel world (pure logic) ================= */
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];   // E N W S
const DIR_ZH = ['東 →', '北 ↑', '西 ←', '南 ↓'];
const MAX_STEPS = 3000;
class RErr extends Error { constructor(msg, line, kind){ super(msg); this.line = line; this.kind = kind; } }
class BreakSig { constructor(l){ this.line = l; } }
class NextSig { constructor(l){ this.line = l; } }
class ReturnSig { constructor(v, l){ this.v = v; this.line = l; } }
class RFun { constructor(params, body, env){ this.params = params; this.body = body; this.env = env; } }   // a closure: parameters, body, and where it was defined
const KWS = new Set(['if','else','for','while','repeat','in','break','next','TRUE','FALSE','NULL','NA','function']);
const FULLWIDTH = {'（':'(', '）':')', '，':',', '｛':'{', '｝':'}', '；':';', '＝':'=', '＜':'<', '＞':'>', '“':'"', '”':'"', '：':':'};

function tokenize(src){
  const toks = []; let i = 0, line = 1; const n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '\n') { toks.push({ t: 'nl', line, s: i, e: i + 1 }); line++; i++; continue; }
    if (c === ' ' || c === '\t' || c === '\r' || c === '　') { i++; continue; }
    if (c === '#') { while (i < n && src[i] !== '\n') i++; continue; }
    if (src.startsWith('___', i)) throw new RErr('把 ___ 換成你的答案再執行', line);
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i + 1] || ''))) {
      let j = i; while (j < n && /[0-9.]/.test(src[j])) j++;
      const v = parseFloat(src.slice(i, j)); if (src[j] === 'L') j++;
      toks.push({ t: 'num', v, line, s: i, e: j }); i = j; continue;
    }
    if (/[A-Za-z_.]/.test(c)) {
      let j = i; while (j < n && /[A-Za-z0-9_.]/.test(src[j])) j++;
      const w = src.slice(i, j);
      toks.push({ t: KWS.has(w) ? w : 'id', v: w, line, s: i, e: j }); i = j; continue;
    }
    if (c === '"' || c === "'") {
      let j = i + 1, s = '';
      while (j < n && src[j] !== c && src[j] !== '\n') {
        if (src[j] === '\\' && j + 1 < n) { const m = src[j + 1]; s += m === 'n' ? '\n' : m === 't' ? '\t' : m; j += 2; }
        else s += src[j++];
      }
      if (src[j] !== c) throw new RErr('字串少了結尾的引號', line);
      toks.push({ t: 'str', v: s, line, s: i, e: j + 1 }); i = j + 1; continue;
    }
    if (FULLWIDTH[c]) throw new RErr(`這裡用了全形符號「${c}」，請改成半形的「${FULLWIDTH[c]}」`, line);
    let op = ['%in%', '<<-', '<-', '<=', '>=', '==', '!=', '&&', '||', '%%'].find(o => src.startsWith(o, i));
    if (!op && '+-*/^<>!&|=(){}[],:;$'.includes(c)) op = c;
    if (!op) throw new RErr(`unexpected input「${c}」`, line);
    toks.push({ t: op, line, s: i, e: i + op.length }); i += op.length;
  }
  toks.push({ t: 'eof', line, s: n, e: n });
  return toks;
}

function parse(src){
  const toks = tokenize(src); let p = 0, depth = 0;
  const peek = (o = 0) => toks[p + o], next = () => toks[p++];
  const show = t => t.t === 'nl' ? '換行' : t.t === 'eof' ? '程式結尾' : t.v !== undefined ? String(t.v) : t.t;
  const err = (t, msg) => new RErr(msg || `unexpected '${show(t)}'`, t.line);
  const skipNL = () => { while (peek().t === 'nl' || peek().t === ';') p++; };
  const skipNLonly = () => { while (peek().t === 'nl') p++; };
  const expect = (t, msg) => { if (peek().t !== t) throw err(peek(), msg); return next(); };
  function stmts(end){
    const body = []; skipNL();
    while (peek().t !== end) {
      if (peek().t === 'eof') throw err(peek(), '少了結尾的 }');
      body.push(statement());
      const t = peek().t;
      if (!(t === 'nl' || t === ';' || t === 'eof' || t === '}')) throw err(peek(), `unexpected '${show(peek())}'：一行只能寫一個指令（或用換行分開）`);
      skipNL();
    }
    return body;
  }
  const body = () => { skipNLonly(); return statement(); };
  function condExpr(kw){
    expect('(', `${kw} 後面要接 (`); skipNLonly();
    const s0 = peek().s; const e = expr(); const e0 = toks[p - 1].e; skipNLonly();
    expect(')', `${kw} 的條件少了 )`);
    return { e, text: src.slice(s0, e0) };
  }
  function statement(){
    const t = peek();
    switch (t.t) {
      case 'if': {
        next(); const c = condExpr('if'); const then = body();
        const save = p, nl = peek().t === 'nl'; skipNLonly(); let els = null;
        if (peek().t === 'else') {
          if (nl && depth === 0) throw err(peek(), "unexpected 'else'：在最外層，R 讀到換行就認為 if 已經結束了。請把 else 接在 } 的同一行：} else {");
          next(); els = body();
        } else p = save;
        return { k: 'if', cond: c.e, text: c.text, then, els, line: t.line };
      }
      case 'for': {
        next(); expect('(', 'for 後面要接 (');
        const v = expect('id', 'for 的括號裡先寫變數名稱，例如 for (i in 1:5)').v;
        expect('in', '少了 in，例如 for (i in 1:5)');
        const s0 = peek().s; const seq = expr(); const text = src.slice(s0, toks[p - 1].e);
        expect(')', 'for 的括號少了 )');
        return { k: 'for', v, seq, text, body: body(), line: t.line };
      }
      case 'while': { next(); const c = condExpr('while'); return { k: 'while', cond: c.e, text: c.text, body: body(), line: t.line }; }
      case 'repeat': next(); return { k: 'repeat', body: body(), line: t.line };
      case 'break': case 'next': next(); return { k: t.t, line: t.line };
      case '{': { next(); depth++; const b = stmts('}'); depth--; next(); return { k: 'block', body: b, line: t.line }; }
      case 'else': throw err(t, "unexpected 'else'：else 要緊接在 if 區塊的 } 後面");
    }
    return { k: 'expr', e: expr(), line: t.line };
  }
  const bin = (sub, ops) => () => {
    let a = sub();
    while (ops.includes(peek().t)) { const op = next(); skipNLonly(); a = { k: 'bin', op: op.t, a, b: sub(), line: op.line }; }
    return a;
  };
  function expr(){ return assign(); }
  function assign(){
    const left = orE();
    if (peek().t === '<-' || peek().t === '=' || peek().t === '<<-') {
      const op = next();
      if ((left.k === 'index' || left.k === 'index2') && left.a.k === 'var') { skipNLonly(); return { k: 'assignIdx', name: left.a.name, i: left.i, val: assign(), line: op.line }; }
      if (left.k !== 'var') throw err(op, '只能把值存進變數，例如 x <- 3');
      skipNLonly();
      return { k: 'assign', name: left.name, val: assign(), line: op.line, up: op.t === '<<-' };
    }
    return left;
  }
  const orE = bin(() => andE(), ['||', '|']);
  const andE = bin(() => notE(), ['&&', '&']);
  function notE(){ if (peek().t === '!') { const op = next(); return { k: 'un', op: '!', a: notE(), line: op.line }; } return cmpE(); }
  const cmpE = bin(() => addE(), ['==', '!=', '<', '>', '<=', '>=']);
  const addE = bin(() => mulE(), ['+', '-']);
  const mulE = bin(() => spE(), ['*', '/']);
  const spE = bin(() => seqE(), ['%%', '%in%']);
  const seqE = bin(() => unE(), [':']);
  function unE(){ if (peek().t === '-' || peek().t === '+') { const op = next(); return { k: 'un', op: op.t, a: unE(), line: op.line }; } return powE(); }
  function powE(){ const a = postfix(); if (peek().t === '^') { const op = next(); return { k: 'bin', op: '^', a, b: unE(), line: op.line }; } return a; }
  function postfix(){
    let a = primary();
    for (;;) {
      if (peek().t === '(') {
        if (a.k !== 'var') throw err(peek());
        next(); const args = []; skipNLonly();
        if (peek().t !== ')') for (;;) {
          skipNLonly(); let name = null;
          if ((peek().t === 'id' || peek().t === 'str') && peek(1).t === '=') { name = next().v; next(); }
          args.push({ name, e: expr() }); skipNLonly();
          if (peek().t === ',') { next(); continue; }
          break;
        }
        expect(')', `${a.name}( 少了 )`);
        a = { k: 'call', name: a.name, args, line: a.line };
      } else if (peek().t === '[' && peek(1).t === '[') {
        next(); next(); const i = expr(); expect(']', '少了 ]]'); expect(']', '少了 ]]');
        a = { k: 'index2', a, i, line: a.line };
      } else if (peek().t === '[') {
        next(); const i = expr(); expect(']', '少了 ]');
        a = { k: 'index', a, i, line: a.line };
      } else if (peek().t === '$') {
        next(); const nm = peek(); if (nm.t !== 'id' && nm.t !== 'str') throw err(nm, '$ 後面要接名稱，例如 patient$seq');
        next(); a = { k: 'dollar', a, name: nm.v, line: a.line };
      } else break;
    }
    return a;
  }
  function primary(){
    const t = next();
    switch (t.t) {
      case 'num': case 'str': return { k: 'lit', v: t.v };
      case 'TRUE': return { k: 'lit', v: true };
      case 'FALSE': return { k: 'lit', v: false };
      case 'NULL': return { k: 'lit', v: null };
      case 'NA': return { k: 'lit', v: undefined };
      case 'function': {
        expect('(', 'function 後面要接 (，例如 function(n) { … }');
        const params = []; skipNLonly();
        if (peek().t !== ')') for (;;) {
          const nm = expect('id', 'function( ) 裡面要寫參數名稱，例如 function(n)').v; let def = null;
          if (peek().t === '=') { next(); def = expr(); }
          params.push({ name: nm, def }); skipNLonly();
          if (peek().t === ',') { next(); skipNLonly(); continue; }
          break;
        }
        expect(')', 'function 的參數少了 )');
        return { k: 'fn', params, body: body(), line: t.line };
      }   // NA is represented as undefined
      case 'if': {   // if used as a value: y <- if (x > 5) "high" else "low"
        const c = condExpr('if'); const then = body();
        const save = p; skipNLonly(); let els = null;
        if (peek().t === 'else') { next(); els = body(); } else p = save;
        return { k: 'ifx', cond: c.e, text: c.text, then, els, line: t.line };
      }
      case 'id': return { k: 'var', name: t.v, line: t.line };
      case '(': { skipNLonly(); const e = expr(); skipNLonly(); expect(')', '少了 )'); return e; }
    }
    throw err(t);
  }
  const prog = stmts('eof');
  return prog;
}

/* values: scalars are JS values, vectors are arrays, lists are RList */
class RList { constructor(names, vals){ this.names = names; this.vals = vals; } }
const isList = v => v instanceof RList;
const LIST_HINT = '這是 list（盒子），要先用 $ 或 [[ ]] 把裡面的東西拿出來：[ ] 拿盒子，[[ ]] 打開盒子';
const asVec = v => Array.isArray(v) ? v : v === null ? [] : [v];
const norm = r => r.length === 1 ? r[0] : r;
const fmtNum = x => Number.isInteger(x) ? String(x) : String(Number(x.toPrecision(7)));
const fmtFun = f => `function(${f.params.map(p => p.name).join(', ')})`;
const fmtEl = x => x instanceof RFun ? fmtFun(x) : isList(x) ? `List of ${x.vals.length}` : typeof x === 'string' ? `"${x}"` : typeof x === 'boolean' ? (x ? 'TRUE' : 'FALSE') : x === null || x === undefined ? 'NA' : fmtNum(x);
const fmtCat = x => typeof x === 'string' ? x : fmtEl(x);
const dispW = t => [...t].reduce((n, ch) => n + (/[\u2E80-\uFFEF]/.test(ch) ? 2 : 1), 0);
// like R's print(): numbers share one number of decimals, and every element is padded to the same width
function fmtPrint(v){
  if (v === null) return 'NULL';
  if (v instanceof RFun) return fmtFun(v) + ' { … }';
  if (isList(v)) return v.vals.map((x, i) => `$${v.names[i] || `[[${i + 1}]]`}\n${fmtPrint(x)}\n`).join('\n');
  const V = asVec(v); if (!V.length) return 'numeric(0)';
  let S;
  if (V.every(x => typeof x === 'number' || x === undefined)) {
    const dec = Math.max(0, ...V.filter(x => x !== undefined && isFinite(x)).map(x => (fmtNum(x).split('.')[1] || '').length));
    S = V.map(x => x === undefined ? 'NA' : isFinite(x) ? x.toFixed(dec) : fmtNum(x));
  } else S = V.map(fmtEl);
  const w = Math.max(...S.map(dispW)), str = V.some(x => typeof x === 'string');
  return '[1] ' + S.map(t => str ? t + ' '.repeat(w - dispW(t)) : ' '.repeat(w - dispW(t)) + t).join(' ').replace(/\s+$/, '');
}
const fmtShort = v => { if (v instanceof RFun) return fmtFun(v); if (isList(v)) return `List of ${v.vals.length}`; const V = asVec(v); if (v === null) return 'NULL'; if (V.length === 1) return fmtEl(V[0]); const s = V.slice(0, 8).map(fmtEl).join(' '); return V.length > 8 ? s + ' …' : s; };

function makeWorld(def){
  const walls = new Set(), D = { E: 0, N: 1, W: 2, S: 3 };
  for (const [x, y, s] of def.walls || []) {
    const d = D[s], [dx, dy] = DIRS[d];
    walls.add(`${x},${y},${d}`); walls.add(`${x + dx},${y + dy},${(d + 2) % 4}`);
  }
  const [x, y, dir] = def.robot;
  return { W: def.W, H: def.H, x, y, dir, rot: -dir * 90, beepers: { ...(def.beepers || {}) }, walls, picked: 0, placed: 0 };
}
function isBlocked(w, x, y, d){
  const [dx, dy] = DIRS[d], nx = x + dx, ny = y + dy;
  if (nx < 1 || ny < 1 || nx > w.W || ny > w.H) return true;
  return w.walls.has(`${x},${y},${d}`);
}

function execute(src, def){
  const w = makeWorld(def), steps = [], vars = new Map(Object.entries(def.vars || {}));
  const LIMIT = def.maxSteps || MAX_STEPS;
  let frame = null, depth = 0, callVis = null;   // frame: the running function's local variables { vars, parent, name }
  const findVar = name => { for (let f = frame; f; f = f.parent) if (f.vars.has(name)) return f.vars; return vars.has(name) ? vars : null; };
  const hasVar = name => !!findVar(name);
  const getVar = name => findVar(name).get(name);
  const setVar = (name, v) => (frame ? frame.vars : vars).set(name, v);
  const setUp = (name, v) => { for (let f = frame && frame.parent; f; f = f.parent) if (f.vars.has(name)) return f.vars.set(name, v); vars.set(name, v); };
  const snap = (line, act, extra) => {
    if (steps.length >= LIMIT) throw new RErr(`已經執行超過 ${LIMIT} 步，可能是無限迴圈（或無限遞迴）！`, line, 'inf');
    steps.push({ line, act, x: w.x, y: w.y, dir: w.dir, rot: w.rot, beepers: { ...w.beepers }, picked: w.picked, placed: w.placed,
      vars: [...vars].map(([k, v]) => [k, fmtShort(v)]).concat(frame ? [...frame.vars].map(([k, v]) => [`${k} ⟨${frame.name} 裡⟩`, fmtShort(v)]) : []), ...extra });
  };
  const blocked = d => isBlocked(w, w.x, w.y, d);
  const here = () => w.beepers[`${w.x},${w.y}`] || 0;
  const ROBOT = {
    move(n){
      if (blocked(w.dir)) { snap(n.line, 'bonk', { say: '撞！' }); throw new RErr('撞牆了！前面被擋住，不能 move()。先用 front_is_clear() 檢查看看。', n.line, 'bonk'); }
      const [dx, dy] = DIRS[w.dir]; w.x += dx; w.y += dy; snap(n.line, 'move');
    },
    turn_left(n){ w.dir = (w.dir + 1) % 4; w.rot -= 90; snap(n.line, 'turn'); },
    turn_right(n){ w.dir = (w.dir + 3) % 4; w.rot += 90; snap(n.line, 'turn'); },
    pick_beeper(n){
      const k = `${w.x},${w.y}`;
      if (!w.beepers[k]) { snap(n.line, 'oops', { say: '這裡沒有寶石…' }); throw new RErr('這一格沒有寶石可以撿。可以先用 if (beepers_present()) 檢查。', n.line); }
      w.beepers[k]--; if (!w.beepers[k]) delete w.beepers[k]; w.picked++;
      snap(n.line, 'pick', { say: '撿到了！' });
    },
    put_beeper(n){ const k = `${w.x},${w.y}`; w.beepers[k] = (w.beepers[k] || 0) + 1; w.placed++; snap(n.line, 'put'); },
  };
  const SENSE = {
    front_is_clear: () => !blocked(w.dir), front_is_blocked: () => blocked(w.dir),
    left_is_clear: () => !blocked((w.dir + 1) % 4), left_is_blocked: () => blocked((w.dir + 1) % 4),

  HBB_REF.forEach((b, i) => labels.push([i + 1, 2, b, 'ref']));
  seq.forEach((b, i) => labels.push([i + 1, 1, b, 'base']));
  return { W: 12, H: 2, robot: [1, 1, 0], beepers: {}, walls: [], labels, codons: 3, pid, seq,
    muts: Object.keys(muts).map(Number).sort((a, b) => a - b),
    vars: { ref: [...HBB_REF], patient: new RList(['id', 'gene', 'seq'], [pid, 'HBB', seq]) } };
}

  { id: 'default', tag: '引數', title: '位置引數、具名引數與預設值',
    goal: '完成 <code>plant_row(len, n = 1)</code>：處理 len 格，每格放 n 顆寶石；沒給 n 時每格放 1 顆。下面三次呼叫分別用了「位置引數」「位置＋具名引數」「只用具名引數」，會種出虛線標示的樣子。',
    concept: `<p>定義 function 時寫的是<b>參數</b>（parameter）：<code>function(len, n = 1)</code>。呼叫時傳進去的值叫<b>引數</b>（argument）。引數有兩種傳法：</p>
      <table class="argtbl">
        <tr><th></th><th>寫法</th><th>怎麼對應</th></tr>
        <tr><td><b>位置引數</b><br><small>positional argument</small></td><td><code>plant_row(2, 3)</code></td><td>照<b>順序</b>：第 1 個給 len、第 2 個給 n</td></tr>
        <tr><td><b>具名引數</b><br><small>keyword / named argument</small></td><td><code>plant_row(n = 3, len = 2)</code></td><td>照<b>名字</b>：順序不重要</td></tr>
      </table>
      <p><b>混用時的規則</b>：R 先把有名字的引數配對好，剩下沒名字的，再<b>依序</b>填進還沒被配對的參數。</p>
      <table class="argtbl">
        <tr><th>呼叫</th><th>len</th><th>n</th><th>說明</th></tr>
        <tr><td><code>plant_row(3)</code></td><td>3</td><td>1</td><td>n 沒給，用<b>預設值</b></td></tr>
        <tr><td><code>plant_row(2, 3)</code></td><td>2</td><td>3</td><td>全部照位置</td></tr>
        <tr><td><code>plant_row(2, n = 3)</code></td><td>2</td><td>3</td><td>常見寫法：必填的照位置，選填的寫名字</td></tr>
        <tr><td><code>plant_row(n = 3, 2)</code></td><td>2</td><td>3</td><td>n 先被名字配對，2 再補給 len</td></tr>
        <tr><td><code>plant_row(3, 2)</code></td><td>3</td><td>2</td><td>⚠ 跟上一行不一樣！位置順序很重要</td></tr>
      </table>
      <p><b>什麼時候用哪一種？</b>最重要、必填的參數（通常是第一個）用位置；有預設值、選填的參數寫名字，別人一看就知道那個數字是什麼。你早就在用了：<code>seq(1, 9, by = 2)</code>、<code>round(x, digits = 2)</code>、<code>sum(x, na.rm = TRUE)</code>。</p>
      <p><b>常見錯誤</b>（可以在程式最後加一行試試看）：<code>plant_row(1, 2, 3)</code> 給太多個、<code>plant_row(2, m = 3)</code> 名字打錯，都會出現 <code>unused argument</code>；<code>plant_row(len = 2, len = 3)</code> 同一個參數給兩次也會出錯；<code>plant_row()</code> 沒給必填的 len，會出現 <code>argument "len" is missing</code>。</p>`,
    starter: "# 處理 len 格，每格放 n 顆；n 沒給就放 1 顆\nplant_row <- function(len, n = 1) {\n\n}\n\nplant_row(3)                 # 位置引數：len = 3；n 沒給，用預設值 1\nmove()\nplant_row(2, n = 3)          # 位置引數 len = 2 ＋ 具名引數 n = 3\nmove()\nplant_row(n = 2, len = 1)    # 全部用具名引數：順序可以對調\n", solution: "plant_row <- function(len, n = 1) {\n  for (i in seq_len(len)) {\n    for (k in seq_len(n)) put_beeper()\n    if (i < len) move()\n  }\n}\nplant_row(3)\nmove()\nplant_row(2, n = 3)\nmove()\nplant_row(n = 2, len = 1)\n",
    hint: '兩層迴圈：外層 <code>for (i in seq_len(len))</code>，內層放 n 顆；格子之間要 move()，但最後一格不要（<code>if (i &lt; len) move()</code>）。',
    par: 9, req: [['function', 1, 'function']],
    def: () => corridor(6, {}, { targets: [[1, 1, 1], [2, 1, 1], [3, 1, 1], [4, 1, 3], [5, 1, 3], [6, 1, 2]] }),
    check: w => {
      const want = [1, 1, 1, 3, 3, 2];
      for (let x = 1; x <= 6; x++) { const n = w.beepers[`${x},1`] || 0; if (n !== want[x - 1]) return { ok: false, msg: `第 ${x} 格應該有 ${want[x - 1]} 顆，現在有 ${n} 顆。` }; }
      return { ok: true };
    } },

  { id: 'decomp', tag: '分解問題', title: '分解問題：收割整片田',
    goal: '田地大小每次不同，每格最多 1 顆寶石。完成 <code>harvest_row()</code>：收完一整列，再走回西邊（最後面向西）。主程式用它一列一列往上收，把寶石全部收光。',
    concept: `<p>遇到大問題，先把它<b>拆成小問題</b>，每個小問題做成一個 function，這叫<b>由上而下設計</b>（top-down design）。</p>
      <p>這關的主程式只要說：「收一列 → 上面還有路嗎？→ 上樓 → 再收一列」。怎麼收一列，交給 <code>harvest_row()</code> 去煩惱。</p>
      <p>好的 function：<b>只做一件事</b>、名字說清楚它做了什麼、而且<b>結束時的狀態固定</b>（這裡是「在西邊、面向西」），主程式才能放心接著用。</p>`,
    starter: "turn_around <- function() {\n  turn_left()\n  turn_left()\n}\n\n# 收一整列：往東撿到底，再走回西邊（最後面向西）\nharvest_row <- function() {\n\n}\n\nrepeat {\n  harvest_row()\n  # 面向西時，北方在右手邊：上面沒路就結束\n\n  turn_right()\n  move()\n  turn_right()\n}\n", solution: "turn_around <- function() {\n  turn_left()\n  turn_left()\n}\nharvest_row <- function() {\n  if (beepers_present()) pick_beeper()\n  while (front_is_clear()) {\n    move()\n    if (beepers_present()) pick_beeper()\n  }\n  turn_around()\n  while (front_is_clear()) move()\n}\nrepeat {\n  harvest_row()\n  if (right_is_blocked()) break\n  turn_right()\n  move()\n  turn_right()\n}\n",
    hint: 'harvest_row：先檢查第一格，<code>while (front_is_clear())</code> 走一步檢查一次；到底後 <code>turn_around()</code>、走回牆邊。主程式空白處：<code>if (right_is_blocked()) break</code>。',
    par: 16, req: [['function', 2, '至少兩個 function']],
    random: true, def: () => {
      const W = randInt(3, 6), H = randInt(2, 4), g = [];
      for (let x = 1; x <= W; x++) for (let y = 1; y <= H; y++) if (Math.random() < .4) g.push([x, y]);
      return field(W, H, g);
    },
    tests: [field(5, 3, [[1, 1], [5, 1], [3, 2], [1, 3], [5, 3]]), field(6, 1, [[2, 1], [6, 1]]), field(1, 4, [[1, 2], [1, 4]]), field(4, 4, [[4, 4]])],
    describe: d => `${d.W} × ${d.H} 的田`,
    check: (w, d) => left(w) ? { ok: false, msg: `還有 ${left(w)} 顆寶石沒收。` } : { ok: true } },

  { id: 'search', tag: '搜尋', title: '線性搜尋',
    goal: '寶石可能在走廊某一格，也可能根本沒有。完成 <code>find_gem()</code>：從第 1 格開始一格一格找，找到就<b>立刻</b>回傳它在第幾格；走到牆邊都沒找到就回傳 0。',
    concept: `<p><b>演算法</b>就是「解決問題的步驟」。最簡單的搜尋演算法是<b>線性搜尋</b>：從頭一個一個看，看到就停。</p>
      <p><code>return()</code> 會<b>立刻結束整個 function</b>，就算在 repeat 或 for 裡面也一樣。比較：<code>break</code> 只離開迴圈；<code>return</code> 離開 function。</p>
      <p>效率：寶石在第 1 格，看 1 次就找到；在最後一格或沒有寶石，要看完全部 n 格。我們說線性搜尋最差要 <b>n 步</b>。</p>`,
    starter: "find_gem <- function() {\n  i <- 1                 # R 寶現在在第 1 格\n  repeat {\n    # 腳下有寶石：回傳 i\n\n    # 前面是牆：都沒找到，回傳 0\n\n    move()\n    i <- i + 1\n  }\n}\n\npos <- find_gem()\ncat(\"寶石在第\", pos, \"格\\n\")\n", solution: "find_gem <- function() {\n  i <- 1\n  repeat {\n    if (beepers_present()) return(i)\n    if (front_is_blocked()) return(0)\n    move()\n    i <- i + 1\n  }\n}\npos <- find_gem()\ncat(\"寶石在第\", pos, \"格\\n\")\n",
    hint: '兩個空白分別寫 <code>if (beepers_present()) return(i)</code> 和 <code>if (front_is_blocked()) return(0)</code>。順序很重要。',
    par: 9, req: [['function', 1, 'function'], ['return', 2, 'return()']],
    random: true, def: () => { const W = randInt(6, 10); return corridor(W, Math.random() < .75 ? gemsAt([randInt(1, W)]) : {}); },
    tests: [[8, 1], [8, 8], [8, 0], [6, 4]].map(([W, g]) => corridor(W, g ? gemsAt([g]) : {})),
    describe: d => `長度 ${d.W}、${Object.keys(d.beepers).length ? `寶石在第 ${Object.keys(d.beepers)[0].split(',')[0]} 格` : '沒有寶石'}`,
    check: (w, d, t) => {
      const g = Object.keys(d.beepers).length ? +Object.keys(d.beepers)[0].split(',')[0] : 0;
      if (!t || !t.vars.has('pos')) return { ok: false, msg: '找不到變數 pos。' };
      const p = t.vars.get('pos');
      if (p !== g) return { ok: false, msg: `pos 應該是 ${g}，你的是 ${fmtShort(p)}。` };
      if (g && w.x !== g) return { ok: false, msg: `找到就要立刻停下來：R 寶應該停在第 ${g} 格。` };
      return { ok: true };
    } },

  { id: 'max', tag: '最大值', title: '找最大的寶石堆',
    goal: '每一格都有一堆寶石。找出最大的那一堆在第幾格（一樣大時取最前面那一堆），存在 <code>best_pos</code>，最後讓 R 寶停在那一格。每一堆都要維持原本的數量。',
    concept: `<p>「找最大值」的演算法：一路看過去，手上記著<b>目前為止最大的值</b>和<b>它的位置</b>；看到更大的就換掉。</p>
      <pre class="snippet">best &lt;- 0
for (每一個 x) {
  if (x &gt; best) best &lt;- x
}</pre>
      <p>R 的 <code>max()</code>、<code>which.max()</code> 內部就是在做這件事。這關的 <code>count_here()</code> 已經幫你寫好：撿光、數完、再放回去，所以寶石堆不會被破壞。</p>`,
    starter: "# 工具箱\nturn_around <- function() {\n  turn_left()\n  turn_left()\n}\ncount_here <- function() {      # 數腳下有幾顆（數完放回去）\n  n <- 0\n  while (beepers_present()) {\n    pick_beeper()\n    n <- n + 1\n  }\n  for (k in seq_len(n)) put_beeper()\n  n\n}\n\nbest <- 0          # 目前看過最大的數量\nbest_pos <- 0      # 它在第幾格\ni <- 1\nrepeat {\n  c_now <- count_here()\n  # 比目前最大的還大，就更新 best 和 best_pos\n\n  if (front_is_blocked()) break\n  move()\n  i <- i + 1\n}\n\n# 現在在第 i 格：向後轉，走回第 best_pos 格\n\n", solution: "turn_around <- function() {\n  turn_left()\n  turn_left()\n}\ncount_here <- function() {\n  n <- 0\n  while (beepers_present()) {\n    pick_beeper()\n    n <- n + 1\n  }\n  for (k in seq_len(n)) put_beeper()\n  n\n}\nbest <- 0\nbest_pos <- 0\ni <- 1\nrepeat {\n  c_now <- count_here()\n  if (c_now > best) {\n    best <- c_now\n    best_pos <- i\n  }\n  if (front_is_blocked()) break\n  move()\n  i <- i + 1\n}\nturn_around()\nfor (k in seq_len(i - best_pos)) move()\n",
    hint: '更新：<code>if (c_now &gt; best) { best &lt;- c_now; best_pos &lt;- i }</code>（分兩行寫）。走回去：<code>turn_around()</code>，再走 <code>i - best_pos</code> 步。',
    par: 26, req: [['function', 1, 'function']],
    random: true, def: () => pileWorld(Array.from({ length: randInt(5, 8) }, () => randInt(1, 5))),
    tests: [[2, 5, 1, 5, 3], [4, 1, 1, 2], [1, 2, 3, 4, 5, 6], [3, 3, 3]].map(pileWorld),
    describe: d => `寶石堆：${pilesOf({ beepers: d.beepers }, d.W).join(' ')}`,
    check: (w, d, t) => {
      const hs = pilesOf({ beepers: d.beepers }, d.W), now = pilesOf(w, d.W), best = hs.indexOf(Math.max(...hs)) + 1;
      if (now.join() !== hs.join()) return { ok: false, msg: `寶石堆被改動了：原本 ${hs.join(' ')}，現在 ${now.join(' ')}。` };
      if (!t || !t.vars.has('best_pos') || t.vars.get('best_pos') !== best) return { ok: false, msg: `best_pos 應該是 ${best}，你的是 ${t && t.vars.has('best_pos') ? fmtShort(t.vars.get('best_pos')) : '（沒有）'}。` };
      if (w.x !== best) return { ok: false, msg: `R 寶要停在第 ${best} 格（最大那堆），現在在第 ${w.x} 格。` };
      return { ok: true };
    } },

  { id: 'recur', tag: '遞迴', title: '遞迴：去了再回來',
    goal: '寶石在走廊盡頭。完成 <code>there_and_back()</code>：撿到寶石後回到起點放下。<b>不能用 while、for、repeat</b>，也不需要變數記步數，只能讓 function 呼叫自己。',
    concept: `<p><b>遞迴</b>：function 在自己裡面呼叫自己。每一層只解決「一小步」，剩下的交給「下一個自己」。</p>
      <pre class="snippet">fact &lt;- function(n) {
  if (n &lt;= 1) return(1)     # 停止條件
  n * fact(n - 1)           # 交給下一個自己
}
fact(4)    # 4 * 3 * 2 * 1 = 24</pre>
      <p>一定要有<b>停止條件</b>（base case），否則會無限呼叫下去。</p>
      <p>這關的祕密：每一層都是「走一步 → 呼叫自己 → <b>等它做完</b>再走一步」。去程走幾步，回程就自動走幾步。執行時注意對話框裡的「第幾層」。</p>`,
    starter: "turn_around <- function() {\n  turn_left()\n  turn_left()\n}\n\nthere_and_back <- function() {\n  if (front_is_clear()) {\n    # 還沒到牆邊：走一步 → 交給「下一個自己」→ 回程再走一步\n\n  } else {\n    # 到牆邊了（停止條件）：撿寶石、向後轉\n\n  }\n}\n\nthere_and_back()\nput_beeper()\n", solution: "turn_around <- function() {\n  turn_left()\n  turn_left()\n}\nthere_and_back <- function() {\n  if (front_is_clear()) {\n    move()\n    there_and_back()\n    move()\n  } else {\n    pick_beeper()\n    turn_around()\n  }\n}\nthere_and_back()\nput_beeper()\n",
    hint: 'if 裡面三行：<code>move()</code>、<code>there_and_back()</code>、<code>move()</code>。else 裡面：<code>pick_beeper()</code>、<code>turn_around()</code>。',
    par: 13, req: [['there_and_back', 3, '在 there_and_back() 裡面呼叫自己']], ban: ['while', 'for', 'repeat'],
    random: true, def: () => { const L = randInt(3, 9); return corridor(L, gemsAt([L])); },
    tests: [2, 5, 9].map(L => corridor(L, gemsAt([L]))),
    describe: d => `長度 ${d.W} 的走廊`,
    check: w => !w.picked ? { ok: false, msg: '還沒撿到盡頭的寶石。' } : (w.beepers['1,1'] || 0) !== 1 ? { ok: false, msg: `寶石要放回起點，R 寶現在在第 ${w.x} 格。回程的那一步 move() 寫了嗎？` } : { ok: true } },

  { id: 'sort', tag: '大魔王', title: '氣泡排序', boss: true, xp: 150, pass: 'ycc0901',
    goal: '每一格有一堆寶石。用<b>氣泡排序</b>把它們由左到右排成「由少到多」。工具箱已經有 <code>take_all()</code>、<code>put_n(k)</code>、<code>go_home()</code>；格子數 <code>n</code> 在 Environment。完成 <code>pair_sort()</code> 和外面的兩層迴圈。',
    concept: `<p><b>氣泡排序</b>（bubble sort）：從左到右比較<b>相鄰</b>兩堆，左邊比較大就交換。一輪做完，最大的那堆會像氣泡一樣「浮」到最右邊。</p>
      <p>再做一輪，第二大的會浮到倒數第二格……一共做 <b>n − 1 輪</b>。第 pass 輪只需要比較 <b>n − pass</b> 對，因為右邊已經排好了。</p>
      <p><code>pair_sort()</code> 不用真的「交換」：兩堆都撿起來，右邊放 <code>max(a, b)</code>、左邊放 <code>min(a, b)</code> 就排好了。</p>
      <p>效率：n 堆要比較大約 n²/2 次。R 的 <code>sort()</code> 用的是更快的演算法，但想法都是從這裡開始的。（這關步驟很多，可以把速度調快。）</p>`,
    starter: "# 工具箱\nturn_around <- function() {\n  turn_left()\n  turn_left()\n}\ntake_all <- function() {      # 撿光這一格，回傳數量\n  n <- 0\n  while (beepers_present()) {\n    pick_beeper()\n    n <- n + 1\n  }\n  n\n}\nput_n <- function(k) {        # 放 k 顆\n  for (j in seq_len(k)) put_beeper()\n}\ngo_home <- function() {       # 回到第 1 格、面向東\n  turn_around()\n  while (front_is_clear()) move()\n  turn_around()\n}\n\n# R 寶在第 i 格、面向東：把第 i 和 i+1 格排好（小的在左），做完站在第 i+1 格\npair_sort <- function() {\n  a <- take_all()\n  move()\n  b <- take_all()\n  put_n(___)          # 右邊放比較大的\n  turn_around()\n  move()\n  put_n(___)          # 左邊放比較小的\n  turn_around()\n  move()\n}\n\n# 氣泡排序：n（格子數）已經在 Environment\n# 一共 n - 1 輪；每一輪先回到第 1 格，再從左到右比較 n - pass 對\nfor (pass in 1:(n - 1)) {\n\n}\n", solution: "turn_around <- function() {\n  turn_left()\n  turn_left()\n}\ntake_all <- function() {\n  n <- 0\n  while (beepers_present()) {\n    pick_beeper()\n    n <- n + 1\n  }\n  n\n}\nput_n <- function(k) {\n  for (j in seq_len(k)) put_beeper()\n}\ngo_home <- function() {\n  turn_around()\n  while (front_is_clear()) move()\n  turn_around()\n}\npair_sort <- function() {\n  a <- take_all()\n  move()\n  b <- take_all()\n  put_n(max(a, b))\n  turn_around()\n  move()\n  put_n(min(a, b))\n  turn_around()\n  move()\n}\nfor (pass in 1:(n - 1)) {\n  go_home()\n  for (i in 1:(n - pass)) {\n    pair_sort()\n  }\n}\n",
    hint: 'pair_sort 的兩個空白：<code>max(a, b)</code>、<code>min(a, b)</code>。外層迴圈裡：先 <code>go_home()</code>，再 <code>for (i in 1:(n - pass)) pair_sort()</code>。',
    par: 33, req: [['function', 5, 'function'], ['pair_sort', 2, '使用 pair_sort()']],
    random: true, def: () => { let hs; do { hs = Array.from({ length: randInt(4, 6) }, () => randInt(1, 4)); } while (hs.join() === [...hs].sort((a, b) => a - b).join()); return sortWorld(hs); },
    tests: [[4, 3, 2, 1], [2, 1, 3, 1, 2], [1, 2, 3, 4], [3, 1, 4, 1, 2, 2]].map(sortWorld),
    describe: d => `寶石堆：${pilesOf({ beepers: d.beepers }, d.W).join(' ')}`,
    check: (w, d) => {
      const hs = pilesOf({ beepers: d.beepers }, d.W), now = pilesOf(w, d.W), want = [...hs].sort((a, b) => a - b);
      if (now.join() === want.join()) return { ok: true };
      if ([...now].sort((a, b) => a - b).join() !== want.join()) return { ok: false, msg: `寶石的數量變了：原本 ${hs.join(' ')}，現在 ${now.join(' ')}。` };
      return { ok: false, msg: `還沒排好：現在是 ${now.join(' ')}，應該是 ${want.join(' ')}。` };
    } },
];
LEVELS.forEach((l, i) => l.n = i + 1);
</script>

<script>
/* ================= UI ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const HL_KW = /^(for|while|if|else|in|next|break|repeat|function|TRUE|FALSE|NULL)$/;
function hl(src){
  const re = /(#.*$)|("[^"]*")|(\b\d+(?:\.\d+)?\b)|(%in%|<-|%%|==|<=|>=|!=|&&|\|\|)|([A-Za-z_.][\w.]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1]) out += `<span class="t-com">${t}</span>`;
    else if (m[2]) out += `<span class="t-str">${t}</span>`;
    else if (m[3]) out += `<span class="t-num">${t}</span>`;
    else if (m[4]) out += `<span class="t-op">${t}</span>`;
    else if (HL_KW.test(m[0])) out += `<span class="t-kw">${t}</span>`;
    else if (src[re.lastIndex] === '(') out += `<span class="t-fn">${t}</span>`;
    else out += t;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

/* ---------- sound + fx ---------- */
let AC = null;
function tone(f, d = .08, type = 'sine', vol = .05, when = 0){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const SFX = {
  move: () => tone(420 + Math.random() * 60, .05, 'triangle', .035),
  turn: () => tone(700, .06, 'sine', .03),
  check: () => tone(880, .03, 'sine', .015),
  pick: () => { tone(880, .08, 'triangle', .05); tone(1320, .12, 'triangle', .05, .07); },
  put: () => tone(330, .09, 'triangle', .05),
  bonk: () => tone(120, .25, 'sawtooth', .05),
  fail: () => { tone(300, .15, 'square', .03); tone(200, .25, 'square', .03, .14); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .05, i * .11)),
};
function confetti(el, n = 36){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--accent', '--amber', '--ok', '--gem', '--bad'].map(v => cs.getPropertyValue(v));
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i'); s.className = 'confetti';
    const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 160;
    s.style.cssText = `left:${cx}px;top:${cy}px;background:${cols[i % cols.length]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d + 80}px;--r:${Math.random() * 720 - 360}deg`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
}
function toast(msg, gold){
  const t = document.createElement('div'); t.className = 'toast' + (gold ? ' gold' : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2400);
}

const BASE_COL = { A: 'var(--ok)', T: 'var(--bad)', G: 'var(--amber)', C: 'var(--accent)' };
// base letters sit above the robot so the current base stays readable
function labelLayer(def){
  let s = '';
  for (const [x, y, b, cls] of def.labels || []) {
    const px = (x - 1) * CELL, py = (def.H - y) * CELL;
    if (cls === 'ref') {
      s += `<text x="${px + 50}" y="${py + 64}" text-anchor="middle" font-size="44" font-weight="800" font-family="JetBrains Mono, monospace" fill="var(--muted)" opacity=".8">${b}</text>`;
      if (x === 1) s += `<text x="${px + 8}" y="${py + 20}" font-size="15" font-family="JetBrains Mono, monospace" fill="var(--muted)">ref</text>`;
    } else {
      s += `<text x="${px + 20}" y="${py + 34}" text-anchor="middle" font-size="34" font-weight="800" font-family="JetBrains Mono, monospace" fill="${BASE_COL[b] || 'var(--ink)'}" stroke="var(--panel)" stroke-width="5" paint-order="stroke">${b}</text>`;
      s += `<text x="${px + 88}" y="${py + 94}" text-anchor="middle" font-size="15" font-family="JetBrains Mono, monospace" fill="var(--muted)">${x}</text>`;
    }
  }
  return s;
}
function staticLayer(def){
  const { W, H } = def; let s = '';
  for (let x = 1; x <= W; x++) for (let y = 1; y <= H; y++) {
    const px = (x - 1) * CELL, py = (H - y) * CELL;
    s += `<rect x="${px}" y="${py}" width="${CELL}" height="${CELL}" fill="${(x + y) % 2 ? 'var(--tile)' : 'var(--tile2)'}"/>`;
    s += `<circle cx="${px + 50}" cy="${py + 50}" r="4" fill="var(--dot)"/>`;
  }
  for (const [x, y, n] of def.targets || []) {
    const cx = (x - 1) * CELL + 50, cy = (H - y) * CELL + 50;
    s += `<polygon points="${cx},${cy - 24} ${cx + 20},${cy} ${cx},${cy + 24} ${cx - 20},${cy}" fill="none" stroke="var(--target)" stroke-width="3" stroke-dasharray="6 5"/>`;
    s += `<text x="${cx}" y="${cy + 42}" text-anchor="middle" font-size="16" font-family="JetBrains Mono, monospace" fill="var(--target)">×${n}</text>`;
  }
  if (def.codons) for (let x = def.codons; x < W; x += def.codons) s += `<line x1="${x * CELL}" y1="6" x2="${x * CELL}" y2="${H * CELL - 6}" stroke="var(--muted)" stroke-width="3" stroke-dasharray="8 7" opacity=".55"/>`;
  for (const [x, y, side] of def.walls || []) {
    const px = (x - 1) * CELL, py = (H - y) * CELL;
    s += side === 'E' ? `<line x1="${px + CELL}" y1="${py}" x2="${px + CELL}" y2="${py + CELL}" stroke="var(--wall)" stroke-width="9" stroke-linecap="round"/>`
                      : `<line x1="${px}" y1="${py}" x2="${px + CELL}" y2="${py}" stroke="var(--wall)" stroke-width="9" stroke-linecap="round"/>`;
  }
  s += `<rect x="3" y="3" width="${W * CELL - 6}" height="${H * CELL - 6}" fill="none" stroke="var(--wall)" stroke-width="7" rx="4"/>`;
  return s;
}
function gemLayer(beepers, H, st){
  let s = '';
  for (const [k, n] of Object.entries(beepers)) {
    const [x, y] = k.split(',').map(Number), cx = (x - 1) * CELL + 50, cy = (H - y) * CELL + 50;
    const pop = st && st.act === 'put' && st.x === x && st.y === y;
    s += `<g>${gemShape(cx, cy, 20, pop ? 'gem-pop' : '')}`;
    if (n > 1) s += `<circle cx="${cx + 22}" cy="${cy - 22}" r="13" fill="var(--ink)"/><text x="${cx + 22}" y="${cy - 17}" text-anchor="middle" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace" fill="var(--panel)">${n}</text>`;
    s += '</g>';
  }
  if (st && st.act === 'pick') s += gemShape((st.x - 1) * CELL + 50, (H - st.y) * CELL + 50, 20, 'gem-poof');
  return s;
}

let infoTab = 'goal';   // remembered across levels
function setupInfo(){
  const box = $('#infopane'), tab = t => box.querySelector(`[data-t="${t}"]`);
  const show = t => {
    infoTab = t;
    box.querySelectorAll('[role=tab]').forEach(b => { const on = b.dataset.t === t; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; if (on) b.classList.remove('new'); });
    box.querySelectorAll('.tabp').forEach(p => { p.hidden = p.dataset.p !== t; });
  };
  box.querySelector('.tabs').onclick = e => { const b = e.target.closest('[role=tab]'); if (b) show(b.dataset.t); };
  box.querySelector('.tabs').onkeydown = e => {
    const order = ['goal', 'env', 'con'], i = order.indexOf(infoTab);
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const t = order[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; show(t); tab(t).focus();
  };
  // while a program runs, flag tabs whose content changed, and keep the console scrolled to its last line
  const watch = (el, t) => new MutationObserver(() => {
    if (P.trace && infoTab !== t) tab(t).classList.add('new');
    if (t === 'con') { const pn = box.querySelector('[data-p="con"]'); pn.scrollTop = pn.scrollHeight; }
  }).observe(el, { childList: true, subtree: true, characterData: true });
  watch($('#env'), 'env'); watch($('#console'), 'con');
  show(infoTab);
}
function syncEditor(){
  const ed = $('#ed'); const n = ed.value.split('\n').length;
  $('#gutter').textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
  ed.style.height = 'auto'; ed.style.height = Math.max(200, ed.scrollHeight) + 'px';
}
function edKeys(e){
  const ed = e.target;
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); startRun(false); return; }
  if (e.key === 'Tab') { e.preventDefault(); insertAtCursor('  '); return; }
  if (e.key === 'Enter') {
    const before = ed.value.slice(0, ed.selectionStart), lineStart = before.lastIndexOf('\n') + 1, cur = before.slice(lineStart);
    let ind = cur.match(/^\s*/)[0]; if (/\{\s*$/.test(cur)) ind += '  ';
    e.preventDefault(); insertAtCursor('\n' + ind);
  }
}
function insertAtCursor(text){
  const ed = $('#ed'); ed.focus();
  const a = ed.selectionStart, b = ed.selectionEnd;
  ed.setRangeText(text, a, b, 'end');
  ed.dispatchEvent(new Event('input'));
}
function insertSnippet(s){
  toEdit();
  const ed = $('#ed'); const before = ed.value.slice(0, ed.selectionStart);
  const ind = before.slice(before.lastIndexOf('\n') + 1).match(/^\s*/)[0];
  const lineHasText = before.slice(before.lastIndexOf('\n') + 1).trim().length > 0;
  let text = s.replace(/\n/g, '\n' + ind);
  if (lineHasText && !s.startsWith(' else') && !s.endsWith(')')) text = '\n' + ind + text;
  else if (lineHasText && s.endsWith(')') && !/[(\s]$/.test(before)) text = '\n' + ind + text;
  insertAtCursor(text);
  // put the cursor on the empty line inside a new block
  const pos = ed.value.lastIndexOf('{\n', ed.selectionStart);
  if (s.includes('{\n') && pos > -1) { const p2 = ed.value.indexOf('\n', pos + 2); const target = ed.value.indexOf('\n', pos) + 1; const lineEnd = ed.value.indexOf('\n', target); ed.selectionStart = ed.selectionEnd = lineEnd === -1 ? ed.value.length : lineEnd; void p2; }
}

function showWorld(def){
  P.def = def; P.trace = null; P.k = -1;
  goalPreview(def);
  const wEl = $('#world');
  const maxW = Math.round(440 * def.W / def.H);
  const ar = (def.W / def.H).toFixed(3);   // never so small the robot is hard to see
  wEl.style.width = `min(100%, ${maxW}px, max(calc((100vh - 500px) * ${ar}), calc(180px * ${ar})))`;
  wEl.innerHTML = `<svg class="map-svg" viewBox="0 0 ${def.W * CELL} ${def.H * CELL}" role="img" aria-label="${def.W} × ${def.H} 的地圖"><g>${staticLayer(def)}</g><g id="gems">${gemLayer(def.beepers || {}, def.H)}</g></svg>
    <div class="robot instant" id="robot" style="width:${100 / def.W}%;height:${100 / def.H}%"><div class="bubble" id="bubble"></div><div class="rb-rot" id="rbrot">${ROBOT_SVG}</div></div>
    ${def.labels ? `<svg class="over" viewBox="0 0 ${def.W * CELL} ${def.H * CELL}" preserveAspectRatio="none" aria-hidden="true">${labelLayer(def)}</svg>` : ''}
    <svg class="over" id="over" viewBox="0 0 ${def.W * CELL} ${def.H * CELL}" preserveAspectRatio="none" aria-hidden="true"></svg>`;
  const w = makeWorld(def);
  placeRobot({ x: w.x, y: w.y, rot: w.rot, dir: w.dir, picked: 0, placed: 0 }, true);
  say(L.random ? '這張地圖是隨機的！' : '準備好了！', '');
  const pre = Object.entries(def.vars || {});
  $('#env').innerHTML = pre.length ? pre.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(fmtShort(v))}</td></tr>`).join('') : `<tr><td colspan="2" class="empty">Environment is empty</td></tr>`;
  $('#console').innerHTML = '<span class="prompt">&gt;</span> ';
  $('#result').hidden = true;
}
function placeRobot(st, instant){
  const r = $('#robot'), H = P.def.H;
  if (instant) r.classList.add('instant');
  r.style.transform = `translate(${(st.x - 1) * 100}%, ${(H - st.y) * 100}%)`;
  $('#rbrot').style.transform = `rotate(${st.rot}deg)`;
  if (instant) { void r.offsetWidth; r.classList.remove('instant'); }
  // the robot hides the gem in its own cell, so show what is underfoot as a badge drawn above the robot
  const beepers = st.beepers || P.def.beepers || {}, under = beepers[`${st.x},${st.y}`] || 0;
  const bx = (st.x - 1) * CELL + 52, by = (H - st.y) * CELL + 3, fresh = st.act === 'put' || st.act === 'pick';
  $('#over').innerHTML = under ? `<g class="${fresh ? 'under-badge' : ''}"><rect x="${bx}" y="${by}" width="46" height="26" rx="13" fill="var(--panel)" stroke="var(--gem-edge)" stroke-width="2.5"/>
    <polygon points="${bx + 13},${by + 5} ${bx + 21},${by + 13} ${bx + 13},${by + 21} ${bx + 5},${by + 13}" fill="var(--gem)" stroke="var(--gem-edge)" stroke-width="1.5"/>
    <text x="${bx + 34}" y="${by + 19}" text-anchor="middle" font-size="16" font-weight="700" font-family="JetBrains Mono, monospace" fill="var(--ink)">${under}</text></g>` : '';
  $('#wstatus').innerHTML = `<span>位置 <b>(${st.x}, ${st.y})</b></span><span>面向 <b>${DIR_ZH[st.dir]}</b></span><span>腳下寶石 <b>${under}</b></span><span>撿起 <b>${st.picked}</b></span><span>放下 <b>${st.placed}</b></span>${P.trace ? `<span>步驟 <b>${P.k + 1}/${P.trace.steps.length}</b></span>` : ''}`;
}
function say(text, cls){
  const b = $('#bubble'); if (!b) return;
  if (!text) { b.classList.remove('show'); return; }
  b.textContent = text;
  const x = P.trace && P.k >= 0 ? P.trace.steps[P.k].x : makeWorld(P.def).x;
  b.className = 'bubble show ' + (cls || '') + (x <= 1 ? ' l' : x >= P.def.W ? ' r' : '');
}
function flash(cls, ms = 520){ const r = $('#robot'); r.classList.remove(cls); void r.offsetWidth; r.classList.add(cls); setTimeout(() => r.classList.remove(cls), ms); }

/* ---------- running ---------- */
const baseDur = () => 820 - (S.speed || 5) * 74;
function toEdit(){
  stopPlay(); P.mode = 'edit';
  $('#editorBox').hidden = false; $('#codeview').hidden = true; $('#bEdit').hidden = true;
}
function toView(){
  P.mode = 'run';
  $('#editorBox').hidden = true; $('#codeview').hidden = false; $('#bEdit').hidden = false;
  renderCode(-1);
  // where the world sits above the code (narrow screens), bring it into view before the robot starts moving
  const wp = $('.worldpane'), r = wp.getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) wp.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function renderCode(cur, errLine){
  const hits = {}; if (P.trace) for (let x = 0; x <= P.k; x++) { const l = P.trace.steps[x].line; hits[l] = (hits[l] || 0) + 1; }
  $('#codeview').innerHTML = $('#ed').value.split('\n').map((l, i) =>
    `<div class="ln${i + 1 === cur ? ' cur' : ''}${i + 1 === errLine ? ' errl' : ''}"><span class="no">${i + 1}</span><code>${hl(l) || ' '}</code></div>`).join('');
  // scroll inside the code box only, so the page (and R 寶's world) never jumps away
  const cv = $('#codeview'), c = cv.querySelector('.cur, .errl');
  if (c) cv.scrollTop = Math.max(0, c.offsetTop - cv.clientHeight / 2 + c.offsetHeight / 2);
}
function prepare(){
  stopPlay();
  if (P.trace && P.k >= 0) showWorld(P.def);      // replay on a fresh copy of the same map
  const code = $('#ed').value; S.codes[L.id] = code; save();
  P.trace = execute(code, P.def); P.k = -1; P.out = ''; P.done = false;
  if (P.trace.error && P.trace.error.kind === 'inf') P.trace.steps = P.trace.steps.slice(0, 36);   // show a few laps, not 3000 steps
  $('#result').hidden = true;
  $('#console').innerHTML = '<span class="prompt">&gt; source("level' + L.n + '.R")</span>\n';
  toView();
  if (!P.trace.steps.length) { finish(); return false; }
  return true;
}
function startRun(){ if (prepare()) resumePlay(); }
function stepOnce(){
  if (!P.trace || P.done || P.mode !== 'run') { if (!prepare()) return; }
  pausePlay();
  if (P.k < P.trace.steps.length - 1) advance(); else finish();
}
function resumePlay(){
  if (!P.trace || P.done) return;
  P.playing = true; $('#bPause').disabled = false; $('#bPause').textContent = '⏸ 暫停'; tick();
}
function pausePlay(){ P.playing = false; clearTimeout(P.timer); if ($('#bPause')) { $('#bPause').textContent = '▶ 繼續'; $('#bPause').disabled = !P.trace || P.done; } }
function stopPlay(){ P.playing = false; clearTimeout(P.timer); if ($('#bPause')) { $('#bPause').disabled = true; $('#bPause').textContent = '⏸ 暫停'; } }
function tick(){
  if (!P.playing) return;
  if (P.k >= P.trace.steps.length - 1) { finish(); return; }
  const st = advance();
  const robotAct = ['move', 'turn', 'pick', 'put', 'bonk', 'oops'].includes(st.act);
  P.timer = setTimeout(tick, robotAct ? baseDur() : baseDur() * .5);
}
function advance(){
  P.k++;
  const st = P.trace.steps[P.k], d = baseDur();
  $('#world').style.setProperty('--dur', `${Math.max(80, d * .85)}ms`);
  placeRobot(st, false);
  $('#gems').innerHTML = gemLayer(st.beepers, P.def.H, st);
  const r = $('#robot');
  if (st.act === 'move') { r.classList.add('walking'); clearTimeout(r._w); r._w = setTimeout(() => r.classList.remove('walking'), d * .85); }
  if (st.act === 'bonk') flash('bonk', 420);
  if (st.act === 'pick' || st.act === 'put') flash('hop', 500);
  if (st.say) say(st.say, st.ok === true ? 't' : st.ok === false ? 'f' : ''); else if (st.act === 'move') say('');
  (SFX[st.act] || (() => {}))();
  if (st.out) { P.out += st.out; }
  $('#console').innerHTML = '<span class="prompt">&gt; source("level' + L.n + '.R")</span>\n' + esc(P.out);
  // values first (local variables right after globals), function definitions last: they rarely change
  const isFn = ([, v]) => /^function\(/.test(v);
  $('#env').innerHTML = st.vars.length ? [...st.vars.filter(e => !isFn(e)), ...st.vars.filter(isFn)].map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('') : `<tr><td colspan="2" class="empty">Environment is empty</td></tr>`;
  renderCode(st.line);
  return st;
}

function finish(){
  stopPlay(); P.done = true;
  const tr = P.trace, con = $('#console');
  if (P.k < tr.steps.length - 1 && tr.steps.length) { while (P.k < tr.steps.length - 1) { P.k++; } const st = tr.steps[P.k]; placeRobot(st, true); $('#gems').innerHTML = gemLayer(st.beepers, P.def.H); }
  const res = $('#result');
  const fail = (html, bubble, extraBtn) => {
    S.fails[L.id] = (S.fails[L.id] || 0) + 1; save();
    res.hidden = false; res.className = 'result no'; res.innerHTML = html + (extraBtn || '');
    say(bubble, 'f'); $('#robot').classList.add('sad'); setTimeout(() => $('#robot') && $('#robot').classList.remove('sad'), 1400);
    SFX.fail();
  };
  if (tr.error) {
    const e = tr.error;
    con.innerHTML += `<span class="err">Error${e.line ? `（第 ${e.line} 行）` : ''}: ${esc(e.message)}</span>\n`;
    renderCode(-1, e.line);
    fail(`<b>${e.kind === 'bonk' ? '撞牆了！' : e.kind === 'inf' ? '停不下來！' : '程式出錯了'}</b>　${esc(e.message)}`, e.kind === 'bonk' ? '好痛…' : e.kind === 'inf' ? '頭好暈…' : '我看不懂…');
    return;
  }
  const r = L.check(tr.world, P.def, tr);
  if (!r.ok) { con.innerHTML += `<span class="err">✗ ${esc(r.msg)}</span>\n`; fail(`<b>還沒完成</b>　${esc(r.msg)}`, '還沒完成…'); return; }
  const code = $('#ed').value;
  let toks = []; try { toks = tokenize(code); } catch (e) {}
  for (const [kw, n, label] of L.req) {
    if (toks.filter(t => t.t === kw || (t.t === 'id' && t.v === kw)).length < n) {
      fail(`<b>結果對了，但……</b>　這一關要練習用 <code>${esc(label || kw)}</code> 完成喔。`, `要用 ${kw} 喔！`); return;
    }
  }
  for (const kw of L.ban || []) {
    if (toks.some(t => t.t === kw)) { fail(`<b>結果對了，但……</b>　這一關不能用 <code>${esc(kw)}</code>，試試別的寫法。`, `不能用 ${kw} 喔！`); return; }
  }
  for (const def of L.tests || []) {
    const t = execute(code, def);
    const c = t.error ? { ok: false, msg: t.error.message } : L.check(t.world, def, t);
    if (!c.ok) {
      con.innerHTML += `<span class="err">✗ 換一張地圖（${esc(L.describe(def))}）就失敗了</span>\n`;
      fail(`<b>這張地圖過關了，但換成另一張地圖就失敗了。</b><br>${esc(L.describe(def))}：${esc(c.msg)}<br>好的程式要在每一張地圖都能用。`, '換地圖就不行…',
        `<br><button class="btn" type="button" id="bShowFail">在那張地圖上執行看看</button>`);
      $('#bShowFail').onclick = () => { toEdit(); showWorld(def); startRun(); };
      return;
    }
  }
  con.innerHTML += `<span class="good">✓ 任務完成！</span>\n`;
  success(code);
}

function success(code){
  const lines = code.split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#') && !/^[{}]+$/.test(s)).length;
  const now = [true, lines <= L.par, !(S.fails[L.id] > 0)];
  const prev = S.stars[L.id] || [false, false, false];
  const merged = prev.map((v, i) => v || now[i]);
  let xp = 0; if (!prev[0]) xp += L.xp || 50;
  merged.forEach((v, i) => { if (v && !prev[i]) xp += 10; });
  S.stars[L.id] = merged; save();
  if (xp) gain(xp, L.boss ? '打倒大魔王！' : `第 ${L.n} 關`, true);
  renderHeader();
  say('任務完成！', 't'); flash('party', 1000); SFX.win(); confetti($('#robot'), 46);
  const res = $('#result'); res.hidden = false; res.className = 'result ok';
  res.innerHTML = `<b>過關！</b>　你用了 ${lines} 行程式（目標 ${L.par} 行以內）。`;
  const nextL = LEVELS[L.n];
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h3 id="mt">${L.boss ? '打倒大魔王！' : '過關！'}</h3><p style="margin:4px 0 0;color:var(--muted)">第 ${L.n} 關：${L.title}</p>
    <div class="bigstars">
      <div class="${now[0] ? 'on' : ''}"><i>★</i>完成任務</div>
      <div class="${now[1] ? 'on' : ''}"><i>★</i>${lines} 行（目標 ≤ ${L.par}）</div>
      <div class="${now[2] ? 'on' : ''}"><i>★</i>一次就成功</div>
    </div>
    ${!now[1] ? '<p style="font-size:14px;margin:6px 0 0">試試看用迴圈把程式寫得更短，可以拿到第二顆星。</p>' : ''}
    <div class="controls">
      <button class="btn" type="button" id="mStay">留在這關</button>
      <button class="btn primary" type="button" id="mNext">${nextL ? `下一關：${nextL.title} →` : '去預測挑戰 →'}</button>
    </div></div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', onEsc); };
  const onEsc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onEsc);
  m.onclick = e => { if (e.target === m) close(); };
  $('#mStay').onclick = close;
  $('#mNext').onclick = () => { close(); go(nextL ? nextL.id : 'quiz'); };
  $('#mNext').focus();
}

/* ---------- solution (password protected, annotated) ---------- */
const SOL_PASS = '0901';   // only a classroom speed bump: the answers ship with the page
const solPass = () => L.pass || SOL_PASS;   // a level may set its own password (the boss does)
const solUnlocked = new Set();
function modal(html){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', onEsc); };

  m.onclick = e => { if (e.target === m) close(); };

}
function askSolution(){
  if (solUnlocked.has(solPass())) return showSolution();
  const { m, close } = modal(`<h3>看解答</h3><p style="margin:4px 0 12px;color:var(--muted)">請輸入老師提供的密碼</p>

  $('#pwCancel', m).onclick = close;

    else { $('#pwErr', m).textContent = '密碼不對，再試一次。'; inp.select(); const c = $('.card', m); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
  };
}
function showSolution(){
  const nt = SOL_NOTES[L.id] || { idea: '', lines: [], traps: [] };
  const code = L.solution.replace(/\n$/, '').split('\n');

    const note = isCom ? '' : nt.lines[i] || '';
    return `<tr class="${isCom ? 'com' : ''}"><td class="ln">${i + 1}</td><td class="cd"><code>${hl(ln) || '&nbsp;'}</code></td><td class="nt">${esc(note)}</td></tr>`;
  }).join('');

/* ---------- prediction quiz ---------- */
const BOSS = [
  { code: ["f <- function(x) {", "  x * 2", "}", "f(3) + 1"], opts: ["[1] 7", "[1] 8", "[1] 6", "Error"], why: "f(3) 回傳最後一行的值 6，再加 1 是 7。" },
  { code: ["x <- 10", "f <- function() {", "  x <- 1", "}", "f()", "x"], opts: ["[1] 10", "[1] 1", "[1] 11", "Error"], why: "function 裡的 x 是區域變數，改不到外面的 x，所以還是 10。（f() 的最後一行是指派，所以呼叫時不會印東西。）" },
  { code: ["g <- function(a, b = 2) a * b", "g(5)"], opts: ["[1] 10", "[1] 7", "[1] 5", "Error：少了 b"], why: "b 沒給就用預設值 2：5 * 2 = 10。" },
  { code: ["g <- function(a, b = 2) a - b", "g(b = 1, a = 5)"], opts: ["[1] 4", "[1] -4", "[1] 3", "[1] 1"], why: "具名參數不看順序：a = 5、b = 1，5 - 1 = 4。" },
  { code: ["h <- function(n) {", "  if (n > 0) return(\"正\")", "  \"非正\"", "}", "h(-2)"], opts: ["[1] \"非正\"", "[1] \"正\"", "NULL", "Error"], why: "n = -2，if 不成立，不會 return；繼續到最後一行，回傳 \"非正\"。" },
  { code: ["k <- function() {", "  for (i in 1:5) {", "    if (i * i > 10) return(i)", "  }", "  0", "}", "k()"], opts: ["[1] 4", "[1] 3", "[1] 0", "[1] 16"], why: "i = 4 時 16 > 10，return(4) 立刻結束整個 function，後面的 0 不會執行。" },
  { code: ["fact <- function(n) {", "  if (n <= 1) return(1)", "  n * fact(n - 1)", "}", "fact(4)"], opts: ["[1] 24", "[1] 10", "[1] 4", "Error：無限遞迴"], why: "4 * fact(3) = 4 * 3 * fact(2) = 4 * 3 * 2 * fact(1) = 24。" },
  { code: ["r <- function(n) {", "  if (n > 0) {", "    cat(n, \"\")", "    r(n - 1)", "  }", "}", "r(3)"], opts: ["3 2 1", "1 2 3", "3 2 1 0", "3"], why: "先印再呼叫自己：印 3 → r(2) 印 2 → r(1) 印 1 → r(0) 停止。" },
  { code: ["r2 <- function(n) {", "  if (n > 0) {", "    r2(n - 1)", "    cat(n, \"\")", "  }", "}", "r2(3)"], opts: ["1 2 3", "3 2 1", "0 1 2 3", "3"], why: "先呼叫自己、等它做完才印：最深的 r2(1) 最先印出 1，回到上一層印 2，最後印 3。" },
  { code: ["s <- function(v) {", "  total <- 0", "  for (x in v) total <- total + x", "  total", "}", "s(c(2, 4, 6))"], opts: ["[1] 12", "[1] 6", "NULL", "[1] 2 4 6"], why: "最後一行 total 是回傳值：2 + 4 + 6 = 12。" },
  { code: ["s2 <- function(v) {", "  total <- 0", "  for (x in v) total <- total + x", "}", "y <- s2(c(1, 2))", "y"], opts: ["NULL", "[1] 3", "[1] 0", "Error"], why: "最後一行是 for 迴圈，for 的值是 NULL，所以 y 是 NULL。忘了回傳是最常見的錯誤。" },
  { code: ["f <- function(a, b) a - b", "f(b = 10, 3)"], opts: ["[1] -7", "[1] 7", "[1] -10", "Error"], why: "b 先用名字配對到 10，剩下沒名字的 3 依序補給 a：3 - 10 = -7。" },
  { code: ["f <- function(a, b = 5) a * b", "c(f(2, 3), f(2))"], opts: ["[1]  6 10", "[1]  6  6", "[1] 10 10", "Error"], why: "f(2, 3) 照位置：a = 2、b = 3，得 6；f(2) 沒給 b，用預設值 5，得 10。" },
  { code: ["count <- 0", "inc <- function() count <<- count + 1", "inc()", "inc()", "count"], opts: ["[1] 2", "[1] 0", "[1] 1", "Error"], why: "<<- 會改到 function 外面的 count，呼叫兩次就是 2。（能用回傳值就盡量不要用 <<-。）" },
];
let B = null;
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const codeBlock = lines => `<pre class="codeblk">${lines.map(hl).join('\n')}</pre>`;
function renderBossIntro(){

}
function renderBossQ(){
  const q = B.qs[B.i];
  $('#stage').innerHTML = `<section class="boss">
    <div class="bar"><span>第 <b>${B.i + 1}</b> / ${B.qs.length} 題</span><span class="hearts" aria-label="剩下 ${B.lives} 條命">${'♥'.repeat(B.lives)}<span class="lost">${'♥'.repeat(3 - B.lives)}</span></span><span>答對 ${B.right} 題</span>${B.streak >= 2 ? `<span>連對 ${B.streak} 題</span>` : ''}</div>
    <div class="q"><div class="qt">${q.q || '這段程式會輸出什麼？'}</div>${q.code ? codeBlock(q.code) : ''}
      <div class="opts">${q.order.map((o, j) => `<button type="button" class="opt" data-j="${j}">${esc(o.t)}</button>`).join('')}</div>
      <div class="why" hidden id="bwhy"></div><div><button class="btn primary" type="button" id="bNextQ" hidden>下一題 →</button></div></div></section>`;
  $('.opts').onclick = e => {
    const b = e.target.closest('.opt'); if (!b || B.answered) return;
    B.answered = true;
    const pick = q.order[Number(b.dataset.j)];
    document.querySelectorAll('.opt').forEach((el, j) => { el.disabled = true; if (q.order[j].ok) el.classList.add('right'); });
    const why = $('#bwhy'); why.hidden = false;
    if (pick.ok) { B.right++; B.streak++; gain(15 + (B.streak >= 3 ? 5 : 0), B.streak >= 3 ? `連對 ${B.streak} 題` : '答對'); SFX.pick(); confetti(b, 16); why.className = 'why ok'; why.innerHTML = '答對了！' + esc(q.why); }
    else { b.classList.add('wrong'); B.lives--; B.streak = 0; SFX.fail(); why.className = 'why no'; why.innerHTML = '扣一條命。' + esc(q.why); }
    const last = B.lives === 0 || B.i === B.qs.length - 1;
    const nx = $('#bNextQ'); nx.hidden = false; nx.textContent = last ? '看結果' : '下一題 →'; nx.focus();
    nx.onclick = () => { B.answered = false; if (last) renderBossEnd(); else { B.i++; renderBossQ(); } };
  };
}
function renderBossEnd(){
  const r = B.right, best = r > S.bossBest;
  if (best) { S.bossBest = r; save(); }
  if (r >= 6 && !S.awarded.boss) { S.awarded.boss = 1; gain(50, '預測挑戰通關', true); }
  renderHeader();
  const rank = r >= 8 ? 'R 迴圈大師' : r >= 6 ? '迴圈高手' : r >= 4 ? '穩定進步中' : '迴圈見習生';
  $('#stage').innerHTML = `<section class="boss"><div class="pane"><div class="pane-b" style="padding:18px">
    <h3>${B.lives === 0 ? '命用完了' : '挑戰完成'}</h3>
    <div class="big" id="bigscore">${r} <span style="font-size:.4em;color:var(--muted)">/ ${B.qs.length}</span></div>
    <div class="rank">${rank}</div>
    <p>${best ? '新的最佳紀錄！' : `最佳紀錄：${S.bossBest} / 8`}</p>
    <div class="controls"><button class="btn primary" type="button" id="bAgain">再挑戰一次</button><button class="btn" type="button" id="bBack">回到第 1 關</button></div>
  </div></div></section>`;
  if (r >= 6) { SFX.win(); confetti($('#bigscore'), 50); }
  $('#bAgain').onclick = startBoss; $('#bBack').onclick = () => go('seq');
}

/* ---------- global ---------- */
const resetBtn = $('#resetAll');
resetBtn.onclick = () => {
  if (!resetBtn.classList.contains('armed')) {
    resetBtn.classList.add('armed'); resetBtn.textContent = '再按一次確認清除';
    setTimeout(() => { resetBtn.classList.remove('armed'); resetBtn.textContent = '清除所有進度'; }, 3000);
    return;
  }
  Object.assign(S, { xp: 0, stars: {}, codes: {}, fails: {}, cur: 1, bossBest: 0, awarded: {} });
  save(); resetBtn.classList.remove('armed'); resetBtn.textContent = '清除所有進度';
  toast('進度已清除'); go('seq');
};
go(S.cur === 'quiz' ? 'quiz' : (LEVELS.some(l => l.id === S.cur) ? S.cur : 'seq'));
</script>
