let infoTab = 'goal';   // remembered across levels
function setupInfo(){
  const box = $('#infopane'), tab = t => box.querySelector(`[data-t="${t}"]`);
  const show = t => {
    infoTab = t;
    box.querySelectorAll('[role=tab]').forEach(b => { const on = b.dataset.t === t; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; if (on) b.classList.remove('new'); });
    box.querySelectorAll('.tabp').forEach(p => { p.hidden = p.dataset.p !== t; });
  };
  box.querySelector('.tabs').onclick = e => { const b = e.target.closest('[role=tab]'); if (b) show(b.dataset.t); };
  box.querySelector('.tabs').onkeydown = e => {
    const order = ['goal', 'env', 'con'], i = order.indexOf(infoTab);
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const t = order[(i + (e.key === 'ArrowRight' ? 1 : 2)) % 3]; show(t); tab(t).focus();
  };
  // while a program runs, flag tabs whose content changed, and keep the console scrolled to its last line
  const watch = (el, t) => new MutationObserver(() => {
    if (P.trace && infoTab !== t) tab(t).classList.add('new');
    if (t === 'con') { const pn = box.querySelector('[data-p="con"]'); pn.scrollTop = pn.scrollHeight; }
  }).observe(el, { childList: true, subtree: true, characterData: true });
  watch($('#env'), 'env'); watch($('#console'), 'con');
  show(infoTab);
}
function syncEditor(){
  const ed = $('#ed'); const n = ed.value.split('\n').length;
  $('#gutter').textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
  ed.style.height = 'auto'; ed.style.height = Math.max(200, ed.scrollHeight) + 'px';
}
function edKeys(e){
  const ed = e.target;
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); startRun(false); return; }
  if (e.key === 'Tab') { e.preventDefault(); insertAtCursor('  '); return; }
  if (e.key === 'Enter') {
    const before = ed.value.slice(0, ed.selectionStart), lineStart = before.lastIndexOf('\n') + 1, cur = before.slice(lineStart);
    let ind = cur.match(/^\s*/)[0]; if (/\{\s*$/.test(cur)) ind += '  ';
    e.preventDefault(); insertAtCursor('\n' + ind);
  }
}
function insertAtCursor(text){
  const ed = $('#ed'); ed.focus();
  const a = ed.selectionStart, b = ed.selectionEnd;
  ed.setRangeText(text, a, b, 'end');
  ed.dispatchEvent(new Event('input'));
}
function insertSnippet(s){
  toEdit();
  const ed = $('#ed'); const before = ed.value.slice(0, ed.selectionStart);
  const ind = before.slice(before.lastIndexOf('\n') + 1).match(/^\s*/)[0];
  const lineHasText = before.slice(before.lastIndexOf('\n') + 1).trim().length > 0;
  let text = s.replace(/\n/g, '\n' + ind);
  if (lineHasText && !s.startsWith(' else') && !s.endsWith(')')) text = '\n' + ind + text;
  else if (lineHasText && s.endsWith(')') && !/[(\s]$/.test(before)) text = '\n' + ind + text;
  insertAtCursor(text);
  // put the cursor on the empty line inside a new block
  const pos = ed.value.lastIndexOf('{\n', ed.selectionStart);
  if (s.includes('{\n') && pos > -1) { const p2 = ed.value.indexOf('\n', pos + 2); const target = ed.value.indexOf('\n', pos) + 1; const lineEnd = ed.value.indexOf('\n', target); ed.selectionStart = ed.selectionEnd = lineEnd === -1 ? ed.value.length : lineEnd; void p2; }
}

function showWorld(def){
  P.def = def; P.trace = null; P.k = -1;
  goalPreview(def);
  const wEl = $('#world');
  const maxW = Math.round(440 * def.W / def.H);
  const ar = (def.W / def.H).toFixed(3);   // never so small the robot is hard to see
  wEl.style.width = `min(100%, ${maxW}px, max(calc((100vh - 500px) * ${ar}), calc(180px * ${ar})))`;
  wEl.innerHTML = `<svg class="map-svg" viewBox="0 0 ${def.W * CELL} ${def.H * CELL}" role="img" aria-label="${def.W} × ${def.H} 的地圖"><g>${staticLayer(def)}</g><g id="gems">${gemLayer(def.beepers || {}, def.H)}</g></svg>
    <div class="robot instant" id="robot" style="width:${100 / def.W}%;height:${100 / def.H}%"><div class="bubble" id="bubble"></div><div class="rb-rot" id="rbrot">${ROBOT_SVG}</div></div>
    ${def.labels ? `<svg class="over" viewBox="0 0 ${def.W * CELL} ${def.H * CELL}" preserveAspectRatio="none" aria-hidden="true">${labelLayer(def)}</svg>` : ''}
    <svg class="over" id="over" viewBox="0 0 ${def.W * CELL} ${def.H * CELL}" preserveAspectRatio="none" aria-hidden="true"></svg>`;
  const w = makeWorld(def);
  placeRobot({ x: w.x, y: w.y, rot: w.rot, dir: w.dir, picked: 0, placed: 0 }, true);
  say(L.random ? '這張地圖是隨機的！' : '準備好了！', '');
  const pre = Object.entries(def.vars || {});
  $('#env').innerHTML = pre.length ? pre.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(fmtShort(v))}</td></tr>`).join('') : `<tr><td colspan="2" class="empty">Environment is empty</td></tr>`;
  $('#console').innerHTML = '<span class="prompt">&gt;</span> ';
  $('#result').hidden = true;
}
function placeRobot(st, instant){
  const r = $('#robot'), H = P.def.H;
  if (instant) r.classList.add('instant');
  r.style.transform = `translate(${(st.x - 1) * 100}%, ${(H - st.y) * 100}%)`;
  $('#rbrot').style.transform = `rotate(${st.rot}deg)`;
  if (instant) { void r.offsetWidth; r.classList.remove('instant'); }
  // the robot hides the gem in its own cell, so show what is underfoot as a badge drawn above the robot
  const beepers = st.beepers || P.def.beepers || {}, under = beepers[`${st.x},${st.y}`] || 0;
  const bx = (st.x - 1) * CELL + 52, by = (H - st.y) * CELL + 3, fresh = st.act === 'put' || st.act === 'pick';
  $('#over').innerHTML = under ? `<g class="${fresh ? 'under-badge' : ''}"><rect x="${bx}" y="${by}" width="46" height="26" rx="13" fill="var(--panel)" stroke="var(--gem-edge)" stroke-width="2.5"/>
    <polygon points="${bx + 13},${by + 5} ${bx + 21},${by + 13} ${bx + 13},${by + 21} ${bx + 5},${by + 13}" fill="var(--gem)" stroke="var(--gem-edge)" stroke-width="1.5"/>
    <text x="${bx + 34}" y="${by + 19}" text-anchor="middle" font-size="16" font-weight="700" font-family="JetBrains Mono, monospace" fill="var(--ink)">${under}</text></g>` : '';
  $('#wstatus').innerHTML = `<span>位置 <b>(${st.x}, ${st.y})</b></span><span>面向 <b>${DIR_ZH[st.dir]}</b></span><span>腳下寶石 <b>${under}</b></span><span>撿起 <b>${st.picked}</b></span><span>放下 <b>${st.placed}</b></span>${P.trace ? `<span>步驟 <b>${P.k + 1}/${P.trace.steps.length}</b></span>` : ''}`;
}
function say(text, cls){
  const b = $('#bubble'); if (!b) return;
  if (!text) { b.classList.remove('show'); return; }
  b.textContent = text;
  const x = P.trace && P.k >= 0 ? P.trace.steps[P.k].x : makeWorld(P.def).x;
  b.className = 'bubble show ' + (cls || '') + (x <= 1 ? ' l' : x >= P.def.W ? ' r' : '');
}
function flash(cls, ms = 520){ const r = $('#robot'); r.classList.remove(cls); void r.offsetWidth; r.classList.add(cls); setTimeout(() => r.classList.remove(cls), ms); }

/* ---------- running ---------- */
const baseDur = () => 820 - (S.speed || 5) * 74;
function toEdit(){
  stopPlay(); P.mode = 'edit';
  $('#editorBox').hidden = false; $('#codeview').hidden = true; $('#bEdit').hidden = true;
}
function toView(){
  P.mode = 'run';
  $('#editorBox').hidden = true; $('#codeview').hidden = false; $('#bEdit').hidden = false;
  renderCode(-1);
  // where the world sits above the code (narrow screens), bring it into view before the robot starts moving
  const wp = $('.worldpane'), r = wp.getBoundingClientRect();
  if (r.top < 0 || r.bottom > innerHeight) wp.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function renderCode(cur, errLine){
  const hits = {}; if (P.trace) for (let x = 0; x <= P.k; x++) { const l = P.trace.steps[x].line; hits[l] = (hits[l] || 0) + 1; }
  $('#codeview').innerHTML = $('#ed').value.split('\n').map((l, i) =>
    `<div class="ln${i + 1 === cur ? ' cur' : ''}${i + 1 === errLine ? ' errl' : ''}"><span class="no">${i + 1}</span><code>${hl(l) || ' '}</code></div>`).join('');
  // scroll inside the code box only, so the page (and R 寶's world) never jumps away
  const cv = $('#codeview'), c = cv.querySelector('.cur, .errl');
  if (c) cv.scrollTop = Math.max(0, c.offsetTop - cv.clientHeight / 2 + c.offsetHeight / 2);
}
function prepare(){
  stopPlay();
  if (P.trace && P.k >= 0) showWorld(P.def);      // replay on a fresh copy of the same map
  const code = $('#ed').value; S.codes[L.id] = code; save();
  P.trace = execute(code, P.def); P.k = -1; P.out = ''; P.done = false;
  if (P.trace.error && P.trace.error.kind === 'inf') P.trace.steps = P.trace.steps.slice(0, 36);   // show a few laps, not 3000 steps
  $('#result').hidden = true;
  $('#console').innerHTML = '<span class="prompt">&gt; source("level' + L.n + '.R")</span>\n';
  toView();
  if (!P.trace.steps.length) { finish(); return false; }
  return true;
}
function startRun(){ if (prepare()) resumePlay(); }
function stepOnce(){
  if (!P.trace || P.done || P.mode !== 'run') { if (!prepare()) return; }
  pausePlay();
  if (P.k < P.trace.steps.length - 1) advance(); else finish();
}
function resumePlay(){
  if (!P.trace || P.done) return;
  P.playing = true; $('#bPause').disabled = false; $('#bPause').textContent = '⏸ 暫停'; tick();
}
function pausePlay(){ P.playing = false; clearTimeout(P.timer); if ($('#bPause')) { $('#bPause').textContent = '▶ 繼續'; $('#bPause').disabled = !P.trace || P.done; } }
function stopPlay(){ P.playing = false; clearTimeout(P.timer); if ($('#bPause')) { $('#bPause').disabled = true; $('#bPause').textContent = '⏸ 暫停'; } }
function tick(){
  if (!P.playing) return;
  if (P.k >= P.trace.steps.length - 1) { finish(); return; }
  const st = advance();
  const robotAct = ['move', 'turn', 'pick', 'put', 'bonk', 'oops'].includes(st.act);
  P.timer = setTimeout(tick, robotAct ? baseDur() : baseDur() * .5);
}
function advance(){
  P.k++;
  const st = P.trace.steps[P.k], d = baseDur();
  $('#world').style.setProperty('--dur', `${Math.max(80, d * .85)}ms`);
  placeRobot(st, false);
  $('#gems').innerHTML = gemLayer(st.beepers, P.def.H, st);
  const r = $('#robot');
  if (st.act === 'move') { r.classList.add('walking'); clearTimeout(r._w); r._w = setTimeout(() => r.classList.remove('walking'), d * .85); }
  if (st.act === 'bonk') flash('bonk', 420);
  if (st.act === 'pick' || st.act === 'put') flash('hop', 500);
  if (st.say) say(st.say, st.ok === true ? 't' : st.ok === false ? 'f' : ''); else if (st.act === 'move') say('');
  (SFX[st.act] || (() => {}))();
  if (st.out) { P.out += st.out; }
  $('#console').innerHTML = '<span class="prompt">&gt; source("level' + L.n + '.R")</span>\n' + esc(P.out);
  // values first (local variables right after globals), function definitions last: they rarely change
  const isFn = ([, v]) => /^function\(/.test(v);
  $('#env').innerHTML = st.vars.length ? [...st.vars.filter(e => !isFn(e)), ...st.vars.filter(isFn)].map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('') : `<tr><td colspan="2" class="empty">Environment is empty</td></tr>`;
  renderCode(st.line);
  return st;
}

function finish(){
  stopPlay(); P.done = true;
  const tr = P.trace, con = $('#console');
  if (P.k < tr.steps.length - 1 && tr.steps.length) { while (P.k < tr.steps.length - 1) { P.k++; } const st = tr.steps[P.k]; placeRobot(st, true); $('#gems').innerHTML = gemLayer(st.beepers, P.def.H); }
  const res = $('#result');
  const fail = (html, bubble, extraBtn) => {
    S.fails[L.id] = (S.fails[L.id] || 0) + 1; save();
    res.hidden = false; res.className = 'result no'; res.innerHTML = html + (extraBtn || '');
    say(bubble, 'f'); $('#robot').classList.add('sad'); setTimeout(() => $('#robot') && $('#robot').classList.remove('sad'), 1400);
    SFX.fail();
  };
  if (tr.error) {
    const e = tr.error;
    con.innerHTML += `<span class="err">Error${e.line ? `（第 ${e.line} 行）` : ''}: ${esc(e.message)}</span>\n`;
    renderCode(-1, e.line);
    fail(`<b>${e.kind === 'bonk' ? '撞牆了！' : e.kind === 'inf' ? '停不下來！' : '程式出錯了'}</b>　${esc(e.message)}`, e.kind === 'bonk' ? '好痛…' : e.kind === 'inf' ? '頭好暈…' : '我看不懂…');
    return;
  }
  const r = L.check(tr.world, P.def, tr);
  if (!r.ok) { con.innerHTML += `<span class="err">✗ ${esc(r.msg)}</span>\n`; fail(`<b>還沒完成</b>　${esc(r.msg)}`, '還沒完成…'); return; }
  const code = $('#ed').value;
  let toks = []; try { toks = tokenize(code); } catch (e) {}
  for (const [kw, n, label] of L.req) {
    if (toks.filter(t => t.t === kw || (t.t === 'id' && t.v === kw)).length < n) {
      fail(`<b>結果對了，但……</b>　這一關要練習用 <code>${esc(label || kw)}</code> 完成喔。`, `要用 ${kw} 喔！`); return;
    }
  }
  for (const kw of L.ban || []) {
    if (toks.some(t => t.t === kw)) { fail(`<b>結果對了，但……</b>　這一關不能用 <code>${esc(kw)}</code>，試試別的寫法。`, `不能用 ${kw} 喔！`); return; }
  }
  for (const def of L.tests || []) {
    const t = execute(code, def);
    const c = t.error ? { ok: false, msg: t.error.message } : L.check(t.world, def, t);
    if (!c.ok) {
      con.innerHTML += `<span class="err">✗ 換一張地圖（${esc(L.describe(def))}）就失敗了</span>\n`;
      fail(`<b>這張地圖過關了，但換成另一張地圖就失敗了。</b><br>${esc(L.describe(def))}：${esc(c.msg)}<br>好的程式要在每一張地圖都能用。`, '換地圖就不行…',
        `<br><button class="btn" type="button" id="bShowFail">在那張地圖上執行看看</button>`);
      $('#bShowFail').onclick = () => { toEdit(); showWorld(def); startRun(); };
      return;
    }
  }
  con.innerHTML += `<span class="good">✓ 任務完成！</span>\n`;
  success(code);
}

function success(code){
  const lines = code.split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#') && !/^[{}]+$/.test(s)).length;
  const now = [true, lines <= L.par, !(S.fails[L.id] > 0)];
  const prev = S.stars[L.id] || [false, false, false];
  const merged = prev.map((v, i) => v || now[i]);
  let xp = 0; if (!prev[0]) xp += L.xp || 50;
  merged.forEach((v, i) => { if (v && !prev[i]) xp += 10; });
  S.stars[L.id] = merged; save();
  if (xp) gain(xp, L.boss ? '打倒大魔王！' : `第 ${L.n} 關`, true);
  renderHeader();
  say('任務完成！', 't'); flash('party', 1000); SFX.win(); confetti($('#robot'), 46);
  const res = $('#result'); res.hidden = false; res.className = 'result ok';
  res.innerHTML = `<b>過關！</b>　你用了 ${lines} 行程式（目標 ${L.par} 行以內）。`;
  const nextL = LEVELS[L.n];
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h3 id="mt">${L.boss ? '打倒大魔王！' : '過關！'}</h3><p style="margin:4px 0 0;color:var(--muted)">第 ${L.n} 關：${L.title}</p>
    <div class="bigstars">
      <div class="${now[0] ? 'on' : ''}"><i>★</i>完成任務</div>
      <div class="${now[1] ? 'on' : ''}"><i>★</i>${lines} 行（目標 ≤ ${L.par}）</div>
      <div class="${now[2] ? 'on' : ''}"><i>★</i>一次就成功</div>
    </div>
    ${!now[1] ? '<p style="font-size:14px;margin:6px 0 0">試試看用迴圈把程式寫得更短，可以拿到第二顆星。</p>' : ''}
    <div class="controls">
      <button class="btn" type="button" id="mStay">留在這關</button>
      <button class="btn primary" type="button" id="mNext">${nextL ? `下一關：${nextL.title} →` : '去預測挑戰 →'}</button>
    </div></div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', onEsc); };
  const onEsc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onEsc);
  m.onclick = e => { if (e.target === m) close(); };
  $('#mStay').onclick = close;
  $('#mNext').onclick = () => { close(); go(nextL ? nextL.id : 'quiz'); };
  $('#mNext').focus();
}

/* ---------- target result: where the correct program ends up ---------- */
const ROBOT_INNER = ROBOT_SVG.replace(/^<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
function goalPreview(def){
  const box = $('#goalmini'); if (!box) return;
  const t = execute(L.solution, def);
  if (t.error) { box.innerHTML = ''; $('#goalcap').textContent = ''; return; }
  const w = t.world, H = def.H, px = (w.x - 1) * CELL, py = (H - w.y) * CELL;
  const gems = Object.values(w.beepers).reduce((a, b) => a + b, 0);
  box.innerHTML = `<svg viewBox="0 0 ${def.W * CELL} ${H * CELL}" style="width:min(100%, ${Math.round(84 * def.W / H)}px)" role="img" aria-label="正確程式跑完後的地圖">
    ${staticLayer({ ...def, targets: [] })}${gemLayer(w.beepers, H)}
    <g transform="translate(${px + 28},${py + 72}) scale(.42) rotate(${-w.dir * 90})">${ROBOT_INNER}</g>${def.labels ? labelLayer(def) : ''}</svg>`;
  $('#goalcap').innerHTML = `R 寶停在 <b>(${w.x}, ${w.y})</b>、面向 <b>${DIR_ZH[w.dir]}</b>　地上寶石 <b>${gems}</b> 顆${w.picked ? `　撿起 <b>${w.picked}</b>` : ''}${w.placed ? `　放下 <b>${w.placed}</b>` : ''}`;
}

/* ---------- solution (password protected, annotated) ---------- */
const SOL_PASS = '0901';   // only a classroom speed bump: the answers ship with the page
const solPass = () => L.pass || SOL_PASS;   // a level may set its own password (the boss does)
const solUnlocked = new Set();
function modal(html){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', onEsc); };
  const onEsc = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onEsc);
  m.onclick = e => { if (e.target === m) close(); };
  return { m, close };
}
function askSolution(){
  if (solUnlocked.has(solPass())) return showSolution();
  const { m, close } = modal(`<h3>看解答</h3><p style="margin:4px 0 12px;color:var(--muted)">請輸入老師提供的密碼</p>
    <form id="pwForm" class="pwform"><input id="pw" type="password" autocomplete="off" autocapitalize="off" aria-label="密碼" placeholder="密碼">
    <button class="btn primary" type="submit">確定</button></form><p class="pwerr" id="pwErr" aria-live="polite"></p>
    <div class="controls"><button class="btn" type="button" id="pwCancel">取消</button></div>`);
  const inp = $('#pw', m); inp.focus();
  $('#pwCancel', m).onclick = close;
  $('#pwForm', m).onsubmit = e => {
    e.preventDefault();
    if (inp.value.trim() === solPass()) { solUnlocked.add(solPass()); close(); showSolution(); }
    else { $('#pwErr', m).textContent = '密碼不對，再試一次。'; inp.select(); const c = $('.card', m); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
  };
}
function showSolution(){
  const nt = SOL_NOTES[L.id] || { idea: '', lines: [], traps: [] };
  const code = L.solution.replace(/\n$/, '').split('\n');
  const rows = code.map((ln, i) => {
    const isCom = ln.trim().startsWith('#');
    const note = isCom ? '' : nt.lines[i] || '';
    return `<tr class="${isCom ? 'com' : ''}"><td class="ln">${i + 1}</td><td class="cd"><code>${hl(ln) || '&nbsp;'}</code></td><td class="nt">${esc(note)}</td></tr>`;
  }).join('');
  const { m, close } = modal(`<h3>第 ${L.n} 關 詳解：${esc(L.title)}</h3>
    <p class="sol-idea"><b>思路：</b>${esc(nt.idea)}</p>
    <div class="sol-wrap"><table class="sol"><thead><tr><th>#</th><th>程式碼</th><th>這一行在做什麼</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${nt.traps.length ? `<div class="sol-traps"><b>常見錯誤</b><ul>${nt.traps.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}
    <div class="controls"><button class="btn" type="button" id="solClose">關閉</button><button class="btn primary" type="button" id="solUse">放進編輯器（附註解）</button></div>`);
  m.querySelector('.card').classList.add('wide');
  $('#solClose', m).onclick = close;
  $('#solUse', m).onclick = () => {
    const w = Math.min(34, Math.max(...code.map(l => l.length)) + 2);
    const txt = code.map((ln, i) => { const nn = ln.trim().startsWith('#') ? '' : nt.lines[i]; return nn ? ln.padEnd(w) + '# ' + nn : ln; }).join('\n') + '\n';
    const ed = $('#ed'); ed.value = txt; syncEditor(); S.codes[L.id] = ed.value; save(); toEdit(); close();
  };
}

/* ---------- prediction quiz ---------- */
const BOSS = [
  { code: ['x <- 0', 'for (i in 1:4) {', '  if (i == 3) next', '  x <- x + i', '}', 'x'], opts: ['[1] 7', '[1] 10', '[1] 3', '[1] 6'], why: 'next（其他語言叫 continue）跳過 i = 3 這一圈剩下的程式，但迴圈繼續：1 + 2 + 4 = 7。' },
  { code: ['x <- 0', 'for (i in 1:4) {', '  if (i == 3) break', '  x <- x + i', '}', 'x'], opts: ['[1] 3', '[1] 7', '[1] 6', '[1] 10'], why: 'i = 3 時 break 直接結束迴圈：1 + 2 = 3。' },
  { code: ['n <- 1', 'count <- 0', 'while (n < 20) {', '  n <- n * 3', '  count <- count + 1', '}', 'count'], opts: ['[1] 3', '[1] 2', '[1] 4', '[1] 27'], why: 'n 依序 1 → 3 → 9 → 27，乘了 3 次。' },
  { code: ['for (ch in c("R", "真", "好")) {', '  cat(ch)', '}'], opts: ['R真好', '好真R', 'R 真 好', '[1] "R" "真" "好"'], why: 'for 不只能走訪數字，也能走訪文字向量：ch 依序是 "R"、"真"、"好"。cat() 只給一個參數時不會加空格，所以三次連在一起印成 R真好。' },
  { code: ['x <- 4', 'if (!(x > 5)) {', '  print("小")', '} else {', '  print("大")', '}'], opts: ['[1] "小"', '[1] "大"', 'Error', '什麼都不印'], why: 'x > 5 是 FALSE，前面加上 ! 反轉成 TRUE，所以執行第一個區塊。' },
  { code: ['spots <- c(2, 5, 7)', 'for (i in 1:6) {', '  if (i %in% spots) cat(i, "")', '}'], opts: ['2 5', '2 5 7', '1 3 4 6', 'TRUE TRUE'], why: 'i 從 1 跑到 6，只有 2 和 5 同時在 spots 裡；7 在 spots 裡，但 i 跑不到 7。' },
  { code: ['x <- 1', 'repeat {', '  cat(x, "")', '  if (x >= 3) break', '  x <- x + 1', '}'], opts: ['1 2 3', '1 2', '2 3', '1 2 3 4'], why: 'repeat 先印 x，再檢查 x >= 3。印出 1、2 之後 x 變成 3，印出 3 再檢查時成立，break 離開，所以是 1 2 3。' },
  { code: ['x <- 0', 'if (x > 5 || x == 0) {', '  print("A")', '} else {', '  print("B")', '}'], opts: ['[1] "A"', '[1] "B"', 'Error', '[1] "A" "B"'], why: '|| 是「或者」：x > 5 是 FALSE，但 x == 0 是 TRUE，只要一個成立就是 TRUE。' },
  { code: ['for (i in 3:1) cat(i, "")'], opts: ['3 2 1', '1 2 3', '3', '什麼都不印'], why: '3:1 會產生倒數的向量 c(3, 2, 1)，所以 i 依序是 3、2、1（不是 1、2、3）。每一圈 cat(i, "") 印出 i 和一個空字串；cat 會在兩個參數之間加一個空格，所以結果是「3 2 1 」，每個數字後面都跟著一個空格。' },
  { code: ['x <- 15', 'if (x %% 3 == 0 && x %% 5 == 0) {', '  "FizzBuzz"', '} else if (x %% 3 == 0) {', '  "Fizz"', '} else {', '  x', '}'], opts: ['[1] "FizzBuzz"', '[1] "Fizz"', '[1] 15', '[1] "Fizz" "FizzBuzz"'], why: '15 同時是 3 和 5 的倍數，第一個條件就成立，後面不再檢查。' },
  { code: ['total <- 0', 'for (i in 1:3) {', '  for (j in 1:i) {', '    total <- total + 1', '  }', '}', 'total'], opts: ['[1] 6', '[1] 9', '[1] 3', '[1] 4'], why: '內層的長度跟著 i 變：1 + 2 + 3 = 6 次。' },
  { code: ['v <- c(3, 8, 1, 9, 4)', 'm <- v[1]', 'for (x in v) {', '  if (x > m) m <- x', '}', 'm'], opts: ['[1] 9', '[1] 4', '[1] 3', '[1] 8'], why: '這是自己寫的 max()：遇到比目前 m 大的值就更新。' },
  { code: ['n <- 0', 'for (i in 1:n) print(i)'], opts: ['[1] 1\n[1] 0', '什麼都不印', '[1] 0', 'Error'], why: '陷阱題！1:0 是 c(1, 0)，迴圈會跑兩圈。要安全處理 n = 0，用 seq_len(n)。' },
  { code: ['x <- 5', 'while (TRUE) {', '  x <- x - 2', '  if (x < 0) break', '}', 'x'], opts: ['[1] -1', '[1] 1', '[1] 0', '無限迴圈'], why: 'while (TRUE) 要靠 break 離開。x 依序 3 → 1 → -1，-1 < 0 時 break。' },
  { code: ['y <- ifelse(c(1, 6, 3) > 2, "大", "小")', 'y'], opts: ['[1] "小" "大" "大"', '[1] "小"', '[1] "大" "大" "小"', 'Error: the condition has length > 1'], why: 'ifelse() 是向量化的，會對每個元素分別判斷，跟 if 不同。' },
  { code: ['count <- 0', 'for (i in 1:5) {', '  if (i %% 2 == 1) count <- count + i', '}', 'count'], opts: ['[1] 9', '[1] 6', '[1] 15', '[1] 3'], why: '只加奇數：1 + 3 + 5 = 9。' },
  { q: '哪一段程式會印出 1 到 10 之間的偶數？', code: null,
    opts: ['for (i in 1:10) if (i %% 2 == 0) print(i)', 'for (i in 1:10) if (i / 2 == 0) print(i)', 'for (i in 1:10) if (i %% 2 == 1) print(i)', 'i <- 1\nwhile (i <= 10) print(i)'], why: '%% 取餘數，餘數 0 代表整除。i / 2 是除法，結果不會等於 0。' },
  { code: ['i <- 0', 'repeat {', '  i <- i + 2', '  if (i > 5) break', '}', 'i'], opts: ['[1] 6', '[1] 4', '[1] 5', '無限迴圈'], why: 'repeat 是沒有條件的迴圈，只能靠 break 離開。i 依序 2 → 4 → 6，6 > 5 時停。' },
];
let B = null;
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const codeBlock = lines => `<pre class="codeblk">${lines.map(hl).join('\n')}</pre>`;
function renderBossIntro(){
  $('#stage').innerHTML = `<section class="boss"><div class="pane"><div class="pane-b" style="padding:18px">
    <h3>預測挑戰：R 會印出什麼？</h3>
    <p>這次沒有機器人，只有程式碼。在腦中一行一行執行，選出 R 的輸出。</p>
    <ul class="rules"><li>隨機抽 8 題，你有 3 條命。</li><li>每答對一題 +15 XP，連續答對 3 題以上每題再 +5。</li><li>答對 6 題以上算通關。</li></ul>
    <p class="xptxt">最佳紀錄：${S.bossBest} / 8</p>
    <button class="btn primary" type="button" id="bStart">開始挑戰</button></div></div></section>`;
  $('#bStart').onclick = startBoss;
}
function startBoss(){
  B = { qs: shuffle(BOSS).slice(0, 8).map(q => ({ ...q, order: shuffle(q.opts.map((t, i) => ({ t, ok: i === 0 }))) })), i: 0, lives: 3, right: 0, streak: 0, answered: false };
  renderBossQ();
}
function renderBossQ(){
  const q = B.qs[B.i];
  $('#stage').innerHTML = `<section class="boss">
    <div class="bar"><span>第 <b>${B.i + 1}</b> / ${B.qs.length} 題</span><span class="hearts" aria-label="剩下 ${B.lives} 條命">${'♥'.repeat(B.lives)}<span class="lost">${'♥'.repeat(3 - B.lives)}</span></span><span>答對 ${B.right} 題</span>${B.streak >= 2 ? `<span>連對 ${B.streak} 題</span>` : ''}</div>
    <div class="q"><div class="qt">${q.q || '這段程式會輸出什麼？'}</div>${q.code ? codeBlock(q.code) : ''}
      <div class="opts">${q.order.map((o, j) => `<button type="button" class="opt" data-j="${j}">${esc(o.t)}</button>`).join('')}</div>
      <div class="why" hidden id="bwhy"></div><div><button class="btn primary" type="button" id="bNextQ" hidden>下一題 →</button></div></div></section>`;
  $('.opts').onclick = e => {
    const b = e.target.closest('.opt'); if (!b || B.answered) return;
    B.answered = true;
    const pick = q.order[Number(b.dataset.j)];
    document.querySelectorAll('.opt').forEach((el, j) => { el.disabled = true; if (q.order[j].ok) el.classList.add('right'); });
    const why = $('#bwhy'); why.hidden = false;
    if (pick.ok) { B.right++; B.streak++; gain(15 + (B.streak >= 3 ? 5 : 0), B.streak >= 3 ? `連對 ${B.streak} 題` : '答對'); SFX.pick(); confetti(b, 16); why.className = 'why ok'; why.innerHTML = '答對了！' + esc(q.why); }
    else { b.classList.add('wrong'); B.lives--; B.streak = 0; SFX.fail(); why.className = 'why no'; why.innerHTML = '扣一條命。' + esc(q.why); }
    const last = B.lives === 0 || B.i === B.qs.length - 1;
    const nx = $('#bNextQ'); nx.hidden = false; nx.textContent = last ? '看結果' : '下一題 →'; nx.focus();
    nx.onclick = () => { B.answered = false; if (last) renderBossEnd(); else { B.i++; renderBossQ(); } };
  };
}
function renderBossEnd(){
  const r = B.right, best = r > S.bossBest;
  if (best) { S.bossBest = r; save(); }
  if (r >= 6 && !S.awarded.boss) { S.awarded.boss = 1; gain(50, '預測挑戰通關', true); }
  renderHeader();
  const rank = r >= 8 ? 'R 迴圈大師' : r >= 6 ? '迴圈高手' : r >= 4 ? '穩定進步中' : '迴圈見習生';
  $('#stage').innerHTML = `<section class="boss"><div class="pane"><div class="pane-b" style="padding:18px">
    <h3>${B.lives === 0 ? '命用完了' : '挑戰完成'}</h3>
    <div class="big" id="bigscore">${r} <span style="font-size:.4em;color:var(--muted)">/ ${B.qs.length}</span></div>
    <div class="rank">${rank}</div>
    <p>${best ? '新的最佳紀錄！' : `最佳紀錄：${S.bossBest} / 8`}</p>
    <div class="controls"><button class="btn primary" type="button" id="bAgain">再挑戰一次</button><button class="btn" type="button" id="bBack">回到第 1 關</button></div>
  </div></div></section>`;
  if (r >= 6) { SFX.win(); confetti($('#bigscore'), 50); }
  $('#bAgain').onclick = startBoss; $('#bBack').onclick = () => go('seq');
}

/* ---------- global ---------- */
const resetBtn = $('#resetAll');
resetBtn.onclick = () => {
  if (!resetBtn.classList.contains('armed')) {
    resetBtn.classList.add('armed'); resetBtn.textContent = '再按一次確認清除';
    setTimeout(() => { resetBtn.classList.remove('armed'); resetBtn.textContent = '清除所有進度'; }, 3000);
    return;
  }
  Object.assign(S, { xp: 0, stars: {}, codes: {}, fails: {}, cur: 1, bossBest: 0, awarded: {} });
  save(); resetBtn.classList.remove('armed'); resetBtn.textContent = '清除所有進度';
  toast('進度已清除'); go('seq');
};
go(S.cur === 'quiz' ? 'quiz' : (LEVELS.some(l => l.id === S.cur) ? S.cur : 'seq'));
</script>
