<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="寫 R 程式指揮機器人走迷宮、撿寶石，練習 for、while、repeat、if、%in%、!、&&、break、next、ifelse、巢狀迴圈與 list。">
<meta property="og:title" content="R 寶的奇幻旅程">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%96%3C/text%3E%3C/svg%3E">
<title>R 寶的奇幻旅程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
html{color-scheme:light}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);text-decoration:none;margin-bottom:6px}
.back:hover{color:var(--accent)}
/* Layout: level map strip, then a Karel-style workbench — mission + world on top, R source editor + environment/console below */
:root{
  --bg:#e9edf1; --panel:#fbfcfd; --sunk:#f1f4f7; --ink:#16202b; --muted:#45515e; --line:#d3dae2;
  --accent:#1d5fae; --accent-ink:#ffffff; --accent-soft:#dde9f7;
  --amber:#e0a422; --amber-soft:#fdf1cf; --ok:#1d8656; --ok-soft:#dcf2e6; --bad:#c0392b; --bad-soft:#fbe3e0;
  --tile:#f4f1e8; --tile2:#ece8dc; --dot:#b9b2a0; --wall:#3a3f4a; --gem:#2fb3a6; --gem-edge:#14776e; --target:#8d97a3;
  --t-kw:#8b2fc9; --t-str:#1d7a3a; --t-num:#b4530a; --t-com:#7f8a96; --t-fn:#1d5fae; --t-op:#a3324b;
  --f-display:"Huninn","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC",system-ui,-apple-system,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Noto Sans TC",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a; --panel:#161d25; --sunk:#11171e; --ink:#e3e9f0; --muted:#93a1b1; --line:#283340;
    --accent:#6aa5ec; --accent-ink:#0b1622; --accent-soft:#1b2c42;
    --amber:#e9b949; --amber-soft:#3a3018; --ok:#4cc58b; --ok-soft:#163327; --bad:#f07167; --bad-soft:#3a1d1b;
    --tile:#1d252f; --tile2:#19212a; --dot:#3b4756; --wall:#c9d3df; --gem:#45d1c2; --gem-edge:#a6f0e7; --target:#6f7d8d;
    --t-kw:#c792ea; --t-str:#9ccc65; --t-num:#f5a65b; --t-com:#6c7a89; --t-fn:#82b1ff; --t-op:#ff8fa3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#161d25; --sunk:#11171e; --ink:#e3e9f0; --muted:#93a1b1; --line:#283340;
  --accent:#6aa5ec; --accent-ink:#0b1622; --accent-soft:#1b2c42;
  --amber:#e9b949; --amber-soft:#3a3018; --ok:#4cc58b; --ok-soft:#163327; --bad:#f07167; --bad-soft:#3a1d1b;
  --tile:#1d252f; --tile2:#19212a; --dot:#3b4756; --wall:#c9d3df; --gem:#45d1c2; --gem-edge:#a6f0e7; --target:#6f7d8d;
  --t-kw:#c792ea; --t-str:#9ccc65; --t-num:#f5a65b; --t-com:#6c7a89; --t-fn:#82b1ff; --t-op:#ff8fa3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;font-variant-ligatures:none}
textarea,svg text{font-variant-ligatures:none}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:16px}
code,.mono{font-family:var(--f-code);font-size:.92em}
p code,li code,.concept code,.goal code,.result code{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 .3em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
.brand h1{font-family:var(--f-display);font-size:clamp(28px,4.6vw,42px);line-height:1.1;margin:0;letter-spacing:.02em;text-wrap:balance}
.brand h1 .r{display:inline-grid;place-items:center;width:1.15em;height:1.15em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-code);font-weight:600;font-size:.82em;margin-right:.18em;vertical-align:.06em}
.brand p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.stats{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lv{font-family:var(--f-display);font-size:20px}
.xpbar{width:160px;max-width:40vw;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.xptxt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.chipbtn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 12px;font-size:14px}

/* level map */
.mapwrap{overflow-x:auto;padding-bottom:4px}
.map{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.node{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:1px solid var(--line);background:var(--panel);border-radius:10px;transition:border-color .15s,background .15s}
.node:hover{border-color:var(--accent)}
.node .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-code);font-size:14px;font-weight:600;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.node .tag{font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap}
.node .stars{font-size:12.5px;letter-spacing:1px;color:var(--line);line-height:1}
.node .stars .on{color:var(--amber)}
.node[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.node[aria-current="true"] .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.node.done .num{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.node.lv-boss{border-color:var(--bad);background:var(--bad-soft)}
.node.lv-boss .num{background:var(--bad);border-color:var(--bad);color:var(--panel);font-size:15px}
.node.lv-boss .num,.node.bio .num{line-height:1;overflow:hidden}
.node.lv-boss .tag{color:var(--bad)}
.node.lv-boss.done .num{background:var(--amber);border-color:var(--amber)}
.mission.lv-boss .eyebrow{color:var(--bad);font-weight:700}
.mission.lv-boss h2::before{content:'💀 ';color:var(--bad)}
.node.bio{border-color:var(--ok);background:var(--ok-soft)}
.node.bio .num{background:var(--ok);border-color:var(--ok);color:var(--panel);font-size:15px}
.node.bio .tag{color:var(--ok)}
.mission.bio .eyebrow{color:var(--ok);font-weight:700}
.mission.bio h2::before{content:'🧬 '}

/* workbench */
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-areas:"mission side" "code side";grid-template-rows:auto 1fr;gap:16px;align-items:start}
.a-mission{grid-area:mission}.a-side{grid-area:side;gap:16px}.a-world{grid-area:world}.a-info{grid-area:info}.a-stick{gap:10px}.a-code{grid-area:code}.a-env{grid-area:env}
@media (max-width:920px){.bench{grid-template-columns:minmax(0,1fr);grid-template-areas:"mission" "world" "info" "code";grid-template-rows:none}.bench .a-side,.bench .a-stick{display:contents}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.mission h2{font-family:var(--f-display);font-size:28px;margin:2px 0 6px;line-height:1.2;text-wrap:balance}
.goal{margin:0 0 10px;font-weight:500;max-width:62ch}
.concept{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;background:var(--sunk);font-size:14px}
.concept p{margin:0 0 6px;max-width:65ch}
.concept p:last-child{margin-bottom:0}
.hint{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--amber-soft);font-size:14px}

.pane{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;min-width:0}
.pane-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);letter-spacing:.04em;flex-wrap:wrap}
.pane-h b{color:var(--ink);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px}
.pane-h .acts{display:flex;gap:6px}
.pane-h .acts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:1px 8px;font-size:13px}
.pane-h .acts button:disabled{opacity:.4;cursor:default}

/* world */
.worldpane{overflow:visible}
.worldwrap{padding:46px 14px 12px}
.world{position:relative;margin:0 auto;max-width:100%}
.world svg.map-svg{display:block;width:100%;height:auto}
.world svg.over{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;overflow:visible}
.under-badge{transform-box:fill-box;transform-origin:center;animation:gempop .35s ease-out}
.robot{position:absolute;left:0;top:0;transition:transform var(--dur,.45s) ease-in-out;z-index:2;pointer-events:none}
.robot.instant,.robot.instant .rb-rot{transition:none}
.rb-rot{width:100%;height:100%;display:grid;place-items:center;transition:transform var(--dur,.45s) ease-in-out}
.rb-svg{width:82%;height:82%;overflow:visible}
.rb-body{fill:var(--accent)}
.rb-face{fill:var(--panel)}
.rb-eye{fill:var(--ink)}
.rb-ant{fill:var(--amber)}
.rb-foot{fill:var(--wall)}
.rb-svg .ft{transform-box:fill-box;transform-origin:center}
.robot.walking .f1{animation:foot calc(var(--dur,.45s)/2) ease-in-out infinite alternate}
.robot.walking .f2{animation:foot calc(var(--dur,.45s)/2) ease-in-out infinite alternate-reverse}
@keyframes foot{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
.rb-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleX(1)}96%{transform:scaleX(.15)}}
.robot.bonk .rb-svg{animation:bonk .4s ease-out}
@keyframes bonk{25%{transform:translateX(10%)}50%{transform:translateX(-6%)}75%{transform:translateX(4%)}}
.robot.hop .rb-svg{animation:hop .5s ease-out}
@keyframes hop{40%{transform:scale(1.28)}70%{transform:scale(.95)}}
.robot.party .rb-svg{animation:spin 1s ease-in-out}
@keyframes spin{50%{transform:scale(1.3) rotate(180deg)}100%{transform:scale(1) rotate(360deg)}}
.robot.sad .rb-body{fill:var(--bad)}
.bubble{position:absolute;bottom:88%;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:9px;padding:1px 8px;font-family:var(--f-code);font-size:13px;line-height:1.6;box-shadow:0 2px 0 var(--ink);opacity:0;transition:opacity .15s;z-index:3}
.bubble.show{opacity:1}
.bubble.l{left:0;transform:none}.bubble.r{left:auto;right:0;transform:none}
.bubble.t{border-color:var(--ok);box-shadow:0 2px 0 var(--ok)}
.bubble.f{border-color:var(--bad);box-shadow:0 2px 0 var(--bad)}
.gem-pop{transform-box:fill-box;transform-origin:center;animation:gempop .35s ease-out}
@keyframes gempop{from{transform:scale(0)}70%{transform:scale(1.25)}to{transform:scale(1)}}
.gem-poof{transform-box:fill-box;transform-origin:center;animation:poof .45s ease-out forwards}
@keyframes poof{to{transform:translateY(-30px) scale(.4);opacity:0}}
.wstatus{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.wstatus b{color:var(--ink);font-family:var(--f-code);font-weight:600}

/* editor */
.editor{display:grid;grid-template-columns:44px minmax(0,1fr);font-family:var(--f-code);font-size:14px;line-height:1.7;background:var(--panel)}
.gutter{padding:10px 10px 10px 0;text-align:right;color:var(--t-com);font-size:13px;line-height:1.7*14px;user-select:none;background:var(--sunk);border-right:1px solid var(--line);white-space:pre}
.gutter{line-height:23.8px}
#ed{width:100%;min-height:200px;resize:none;border:0;outline:none;background:transparent;color:var(--ink);font:inherit;font-size:14px;line-height:23.8px;padding:10px 12px;white-space:pre;overflow-x:auto;overflow-y:hidden;tab-size:2}
#ed:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent-soft)}
.codeview{position:relative;font-family:var(--f-code);font-size:14px;line-height:23.8px;padding-block:10px;overflow:auto;max-height:min(62vh,560px);overscroll-behavior:contain;cursor:text}
/* long programs: the code box scrolls by itself, and the world column stays in view */
/* target result, Environment and Console share one tabbed panel under the world */
.infopane .tabs{display:flex;gap:2px;padding:3px 6px 0;background:var(--sunk);border-bottom:1px solid var(--line)}
.infopane .tabs button{position:relative;border:0;background:transparent;padding:6px 12px;font-size:13.5px;letter-spacing:.03em;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.infopane .tabs button:hover{color:var(--ink)}
.infopane .tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.infopane .tabs button.new::after{content:"";position:absolute;top:5px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.tabp{height:150px;overflow:auto;overscroll-behavior:contain}
.tabp .console{min-height:100%;max-height:none;overflow:visible}
.tabp .env thead th{position:sticky;top:0;background:var(--panel);z-index:1}
@media (max-width:920px){.tabp{height:auto;max-height:280px}}
/* world + target result stay pinned together while a long program scrolls by */
@media (min-width:921px){.a-side{align-self:stretch}.a-stick{position:sticky;top:0;z-index:3;background:var(--bg);padding-block:6px 10px;margin-top:-6px}}
@media (max-width:920px){.codeview{max-height:42vh}}
.ln{display:grid;grid-template-columns:44px max-content;white-space:pre;min-width:max-content}
.ln .no{text-align:right;padding-right:10px;color:var(--t-com);font-size:13px;user-select:none}
.ln code{font-size:inherit;padding:0 16px 0 12px}
.ln.cur{background:var(--amber-soft);box-shadow:inset 3px 0 0 var(--amber)}
.ln.errl{background:var(--bad-soft);box-shadow:inset 3px 0 0 var(--bad)}
.ln.cur .no::before{content:"▶ ";color:var(--ok);font-size:12.5px}
.t-kw{color:var(--t-kw);font-weight:600}.t-str{color:var(--t-str)}.t-num{color:var(--t-num)}.t-com{color:var(--t-com);font-style:italic}.t-fn{color:var(--t-fn)}.t-op{color:var(--t-op)}
.snips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;border-top:1px solid var(--line);background:var(--sunk)}
.snips span{font-size:12.5px;color:var(--muted);align-self:center;margin-right:2px}
.snip{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:1px 7px;font-family:var(--f-code);font-size:13px}
.snip:hover{border-color:var(--accent)}
.snip.ctl{color:var(--t-kw)}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:14px;line-height:1.4;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.go{background:var(--ok);border-color:var(--ok);color:var(--panel);font-weight:600;padding-inline:18px}
.speed{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-left:auto}
.speed input{width:90px;accent-color:var(--accent)}
.result{border-radius:8px;padding:10px 12px;font-size:14px}
.result.no{background:var(--bad-soft)}
.result.ok{background:var(--ok-soft)}
.result .btn{margin-top:8px}

.env{width:100%;border-collapse:collapse;font-size:14px}
.env th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:4px 10px;border-bottom:1px solid var(--line)}
.env td{padding:4px 10px;border-bottom:1px solid var(--line);font-family:var(--f-code);font-variant-numeric:tabular-nums}
.env tr:last-child td{border-bottom:0}
.env .empty{color:var(--muted);font-family:var(--f-body)}
.console{margin:0;padding:10px 12px;font-family:var(--f-code);font-size:14px;line-height:1.6;min-height:70px;max-height:180px;overflow:auto;white-space:pre-wrap;background:var(--sunk)}
.console .prompt{color:var(--accent)}
.console .err{color:var(--bad)}
.console .good{color:var(--ok)}

/* modal */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.card{background:var(--panel);border-radius:16px;padding:24px;max-width:420px;width:100%;text-align:center;border:1px solid var(--line);animation:rise .3s ease-out}
.card h3{font-family:var(--f-display);font-size:34px;margin:0}
.bigstars{display:flex;justify-content:center;gap:10px;margin:14px 0 6px}
.bigstars div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);width:96px}
.bigstars i{font-style:normal;font-size:40px;line-height:1;color:var(--line)}
.bigstars .on i{color:var(--amber);animation:starin .5s ease-out backwards}
.bigstars div:nth-child(2) i{animation-delay:.15s}.bigstars div:nth-child(3) i{animation-delay:.3s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}}
.card .controls{justify-content:center;margin-top:14px}

/* quiz (boss) */
.boss{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.boss h3{font-family:var(--f-display);font-size:24px;margin:0 0 4px}
.boss .bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;color:var(--muted)}
.hearts{color:var(--bad);letter-spacing:2px;font-size:18px}
.hearts .lost{color:var(--line)}
.q{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.q .qt{font-weight:500}
.codeblk{margin:0;font-family:var(--f-code);font-size:14px;line-height:1.6;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:pre}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;font-family:var(--f-code);font-size:14px;white-space:pre-wrap}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.why{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.why.ok{background:var(--ok-soft)}.why.no{background:var(--bad-soft)}
.big{font-family:var(--f-display);font-size:52px;line-height:1;margin:6px 0}
.rank{font-family:var(--f-display);font-size:24px;color:var(--accent)}
.rules{margin:0;padding-left:1.2em}

.foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:14px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:14px}
.linkbtn.armed{color:var(--bad)}
.toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:30;pointer-events:none}
.toast{background:var(--ink);color:var(--panel);padding:7px 14px;border-radius:99px;font-size:14px;font-weight:500;animation:rise .3s ease-out}
.toast.gold{background:var(--amber);color:#1c1405}

<script>
/* ================= R-subset interpreter + Karel world (pure logic) ================= */
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];   // E N W S
const DIR_ZH = ['東 →', '北 ↑', '西 ←', '南 ↓'];
const MAX_STEPS = 3000;
class RErr extends Error { constructor(msg, line, kind){ super(msg); this.line = line; this.kind = kind; } }
class BreakSig { constructor(l){ this.line = l; } }
class NextSig { constructor(l){ this.line = l; } }
class ReturnSig { constructor(v, l){ this.v = v; this.line = l; } }
class RFun { constructor(params, body, env){ this.params = params; this.body = body; this.env = env; } }   // a closure: parameters, body, and where it was defined
const KWS = new Set(['if','else','for','while','repeat','in','break','next','TRUE','FALSE','NULL','NA','function']);
const FULLWIDTH = {'（':'(', '）':')', '，':',', '｛':'{', '｝':'}', '；':';', '＝':'=', '＜':'<', '＞':'>', '“':'"', '”':'"', '：':':'};

function tokenize(src){
  const toks = []; let i = 0, line = 1; const n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '\n') { toks.push({ t: 'nl', line, s: i, e: i + 1 }); line++; i++; continue; }
    if (c === ' ' || c === '\t' || c === '\r' || c === '　') { i++; continue; }
    if (c === '#') { while (i < n && src[i] !== '\n') i++; continue; }
    if (src.startsWith('___', i)) throw new RErr('把 ___ 換成你的答案再執行', line);
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i + 1] || ''))) {
      let j = i; while (j < n && /[0-9.]/.test(src[j])) j++;
      const v = parseFloat(src.slice(i, j)); if (src[j] === 'L') j++;
      toks.push({ t: 'num', v, line, s: i, e: j }); i = j; continue;
    }
    if (/[A-Za-z_.]/.test(c)) {
      let j = i; while (j < n && /[A-Za-z0-9_.]/.test(src[j])) j++;
      const w = src.slice(i, j);
      toks.push({ t: KWS.has(w) ? w : 'id', v: w, line, s: i, e: j }); i = j; continue;
    }
    if (c === '"' || c === "'") {
      let j = i + 1, s = '';
      while (j < n && src[j] !== c && src[j] !== '\n') {
        if (src[j] === '\\' && j + 1 < n) { const m = src[j + 1]; s += m === 'n' ? '\n' : m === 't' ? '\t' : m; j += 2; }
        else s += src[j++];
      }
      if (src[j] !== c) throw new RErr('字串少了結尾的引號', line);
      toks.push({ t: 'str', v: s, line, s: i, e: j + 1 }); i = j + 1; continue;
    }
    if (FULLWIDTH[c]) throw new RErr(`這裡用了全形符號「${c}」，請改成半形的「${FULLWIDTH[c]}」`, line);
    let op = ['%in%', '<<-', '<-', '<=', '>=', '==', '!=', '&&', '||', '%%'].find(o => src.startsWith(o, i));
    if (!op && '+-*/^<>!&|=(){}[],:;$'.includes(c)) op = c;
    if (!op) throw new RErr(`unexpected input「${c}」`, line);
    toks.push({ t: op, line, s: i, e: i + op.length }); i += op.length;
  }
  toks.push({ t: 'eof', line, s: n, e: n });
  return toks;
}

function parse(src){
  const toks = tokenize(src); let p = 0, depth = 0;
  const peek = (o = 0) => toks[p + o], next = () => toks[p++];
  const show = t => t.t === 'nl' ? '換行' : t.t === 'eof' ? '程式結尾' : t.v !== undefined ? String(t.v) : t.t;
  const err = (t, msg) => new RErr(msg || `unexpected '${show(t)}'`, t.line);
  const skipNL = () => { while (peek().t === 'nl' || peek().t === ';') p++; };
  const skipNLonly = () => { while (peek().t === 'nl') p++; };
  const expect = (t, msg) => { if (peek().t !== t) throw err(peek(), msg); return next(); };
  function stmts(end){
    const body = []; skipNL();
    while (peek().t !== end) {
      if (peek().t === 'eof') throw err(peek(), '少了結尾的 }');
      body.push(statement());
      const t = peek().t;
      if (!(t === 'nl' || t === ';' || t === 'eof' || t === '}')) throw err(peek(), `unexpected '${show(peek())}'：一行只能寫一個指令（或用換行分開）`);
      skipNL();
    }
    return body;
  }
  const body = () => { skipNLonly(); return statement(); };
  function condExpr(kw){
    expect('(', `${kw} 後面要接 (`); skipNLonly();
    const s0 = peek().s; const e = expr(); const e0 = toks[p - 1].e; skipNLonly();
    expect(')', `${kw} 的條件少了 )`);
    return { e, text: src.slice(s0, e0) };
  }
  function statement(){
    const t = peek();
    switch (t.t) {
      case 'if': {
        next(); const c = condExpr('if'); const then = body();
        const save = p, nl = peek().t === 'nl'; skipNLonly(); let els = null;
        if (peek().t === 'else') {
          if (nl && depth === 0) throw err(peek(), "unexpected 'else'：在最外層，R 讀到換行就認為 if 已經結束了。請把 else 接在 } 的同一行：} else {");
          next(); els = body();
        } else p = save;
        return { k: 'if', cond: c.e, text: c.text, then, els, line: t.line };
      }
      case 'for': {
        next(); expect('(', 'for 後面要接 (');
        const v = expect('id', 'for 的括號裡先寫變數名稱，例如 for (i in 1:5)').v;
        expect('in', '少了 in，例如 for (i in 1:5)');
        const s0 = peek().s; const seq = expr(); const text = src.slice(s0, toks[p - 1].e);
        expect(')', 'for 的括號少了 )');
        return { k: 'for', v, seq, text, body: body(), line: t.line };
      }
      case 'while': { next(); const c = condExpr('while'); return { k: 'while', cond: c.e, text: c.text, body: body(), line: t.line }; }
      case 'repeat': next(); return { k: 'repeat', body: body(), line: t.line };
      case 'break': case 'next': next(); return { k: t.t, line: t.line };
      case '{': { next(); depth++; const b = stmts('}'); depth--; next(); return { k: 'block', body: b, line: t.line }; }
      case 'else': throw err(t, "unexpected 'else'：else 要緊接在 if 區塊的 } 後面");
    }
    return { k: 'expr', e: expr(), line: t.line };
  }
  const bin = (sub, ops) => () => {
    let a = sub();
    while (ops.includes(peek().t)) { const op = next(); skipNLonly(); a = { k: 'bin', op: op.t, a, b: sub(), line: op.line }; }
    return a;
  };
  function expr(){ return assign(); }
  function assign(){
    const left = orE();
    if (peek().t === '<-' || peek().t === '=' || peek().t === '<<-') {
      const op = next();
      if ((left.k === 'index' || left.k === 'index2') && left.a.k === 'var') { skipNLonly(); return { k: 'assignIdx', name: left.a.name, i: left.i, val: assign(), line: op.line }; }
      if (left.k !== 'var') throw err(op, '只能把值存進變數，例如 x <- 3');
      skipNLonly();
      return { k: 'assign', name: left.name, val: assign(), line: op.line, up: op.t === '<<-' };
    }
    return left;
  }
  const orE = bin(() => andE(), ['||', '|']);
  const andE = bin(() => notE(), ['&&', '&']);
  function notE(){ if (peek().t === '!') { const op = next(); return { k: 'un', op: '!', a: notE(), line: op.line }; } return cmpE(); }
  const cmpE = bin(() => addE(), ['==', '!=', '<', '>', '<=', '>=']);
  const addE = bin(() => mulE(), ['+', '-']);
  const mulE = bin(() => spE(), ['*', '/']);
  const spE = bin(() => seqE(), ['%%', '%in%']);
  const seqE = bin(() => unE(), [':']);
  function unE(){ if (peek().t === '-' || peek().t === '+') { const op = next(); return { k: 'un', op: op.t, a: unE(), line: op.line }; } return powE(); }
  function powE(){ const a = postfix(); if (peek().t === '^') { const op = next(); return { k: 'bin', op: '^', a, b: unE(), line: op.line }; } return a; }
  function postfix(){
    let a = primary();
    for (;;) {
      if (peek().t === '(') {
        if (a.k !== 'var') throw err(peek());
        next(); const args = []; skipNLonly();
        if (peek().t !== ')') for (;;) {
          skipNLonly(); let name = null;
          if ((peek().t === 'id' || peek().t === 'str') && peek(1).t === '=') { name = next().v; next(); }
          args.push({ name, e: expr() }); skipNLonly();
          if (peek().t === ',') { next(); continue; }
          break;
        }
        expect(')', `${a.name}( 少了 )`);
        a = { k: 'call', name: a.name, args, line: a.line };
      } else if (peek().t === '[' && peek(1).t === '[') {
        next(); next(); const i = expr(); expect(']', '少了 ]]'); expect(']', '少了 ]]');
        a = { k: 'index2', a, i, line: a.line };
      } else if (peek().t === '[') {
        next(); const i = expr(); expect(']', '少了 ]');
        a = { k: 'index', a, i, line: a.line };
      } else if (peek().t === '$') {
        next(); const nm = peek(); if (nm.t !== 'id' && nm.t !== 'str') throw err(nm, '$ 後面要接名稱，例如 patient$seq');
        next(); a = { k: 'dollar', a, name: nm.v, line: a.line };
      } else break;
    }
    return a;
  }
  function primary(){
    const t = next();
    switch (t.t) {
      case 'num': case 'str': return { k: 'lit', v: t.v };
      case 'TRUE': return { k: 'lit', v: true };
      case 'FALSE': return { k: 'lit', v: false };
      case 'NULL': return { k: 'lit', v: null };
      case 'NA': return { k: 'lit', v: undefined };
      case 'function': {
        expect('(', 'function 後面要接 (，例如 function(n) { … }');
        const params = []; skipNLonly();
        if (peek().t !== ')') for (;;) {
          const nm = expect('id', 'function( ) 裡面要寫參數名稱，例如 function(n)').v; let def = null;
          if (peek().t === '=') { next(); def = expr(); }
          params.push({ name: nm, def }); skipNLonly();
          if (peek().t === ',') { next(); skipNLonly(); continue; }
          break;
        }
        expect(')', 'function 的參數少了 )');
        return { k: 'fn', params, body: body(), line: t.line };
      }   // NA is represented as undefined
      case 'if': {   // if used as a value: y <- if (x > 5) "high" else "low"
        const c = condExpr('if'); const then = body();
        const save = p; skipNLonly(); let els = null;
        if (peek().t === 'else') { next(); els = body(); } else p = save;
        return { k: 'ifx', cond: c.e, text: c.text, then, els, line: t.line };
      }
      case 'id': return { k: 'var', name: t.v, line: t.line };
      case '(': { skipNLonly(); const e = expr(); skipNLonly(); expect(')', '少了 )'); return e; }
    }
    throw err(t);
  }
  const prog = stmts('eof');
  return prog;
}

/* values: scalars are JS values, vectors are arrays, lists are RList */
class RList { constructor(names, vals){ this.names = names; this.vals = vals; } }
const isList = v => v instanceof RList;
const LIST_HINT = '這是 list（盒子），要先用 $ 或 [[ ]] 把裡面的東西拿出來：[ ] 拿盒子，[[ ]] 打開盒子';
const asVec = v => Array.isArray(v) ? v : v === null ? [] : [v];
const norm = r => r.length === 1 ? r[0] : r;
const fmtNum = x => Number.isInteger(x) ? String(x) : String(Number(x.toPrecision(7)));
const fmtFun = f => `function(${f.params.map(p => p.name).join(', ')})`;
const fmtEl = x => x instanceof RFun ? fmtFun(x) : isList(x) ? `List of ${x.vals.length}` : typeof x === 'string' ? `"${x}"` : typeof x === 'boolean' ? (x ? 'TRUE' : 'FALSE') : x === null || x === undefined ? 'NA' : fmtNum(x);
const fmtCat = x => typeof x === 'string' ? x : fmtEl(x);
const dispW = t => [...t].reduce((n, ch) => n + (/[\u2E80-\uFFEF]/.test(ch) ? 2 : 1), 0);
// like R's print(): numbers share one number of decimals, and every element is padded to the same width
function fmtPrint(v){
  if (v === null) return 'NULL';
  if (v instanceof RFun) return fmtFun(v) + ' { … }';
  if (isList(v)) return v.vals.map((x, i) => `$${v.names[i] || `[[${i + 1}]]`}\n${fmtPrint(x)}\n`).join('\n');
  const V = asVec(v); if (!V.length) return 'numeric(0)';
  let S;
  if (V.every(x => typeof x === 'number' || x === undefined)) {
    const dec = Math.max(0, ...V.filter(x => x !== undefined && isFinite(x)).map(x => (fmtNum(x).split('.')[1] || '').length));
    S = V.map(x => x === undefined ? 'NA' : isFinite(x) ? x.toFixed(dec) : fmtNum(x));
  } else S = V.map(fmtEl);
  const w = Math.max(...S.map(dispW)), str = V.some(x => typeof x === 'string');
  return '[1] ' + S.map(t => str ? t + ' '.repeat(w - dispW(t)) : ' '.repeat(w - dispW(t)) + t).join(' ').replace(/\s+$/, '');
}
const fmtShort = v => { if (v instanceof RFun) return fmtFun(v); if (isList(v)) return `List of ${v.vals.length}`; const V = asVec(v); if (v === null) return 'NULL'; if (V.length === 1) return fmtEl(V[0]); const s = V.slice(0, 8).map(fmtEl).join(' '); return V.length > 8 ? s + ' …' : s; };

function makeWorld(def){
  const walls = new Set(), D = { E: 0, N: 1, W: 2, S: 3 };
  for (const [x, y, s] of def.walls || []) {
    const d = D[s], [dx, dy] = DIRS[d];
    walls.add(`${x},${y},${d}`); walls.add(`${x + dx},${y + dy},${(d + 2) % 4}`);
  }
  const [x, y, dir] = def.robot;
  return { W: def.W, H: def.H, x, y, dir, rot: -dir * 90, beepers: { ...(def.beepers || {}) }, walls, picked: 0, placed: 0 };
}
function isBlocked(w, x, y, d){
  const [dx, dy] = DIRS[d], nx = x + dx, ny = y + dy;
  if (nx < 1 || ny < 1 || nx > w.W || ny > w.H) return true;
  return w.walls.has(`${x},${y},${d}`);
}

function execute(src, def){
  const w = makeWorld(def), steps = [], vars = new Map(Object.entries(def.vars || {}));
  const LIMIT = def.maxSteps || MAX_STEPS;
  let frame = null, depth = 0, callVis = null;   // frame: the running function's local variables { vars, parent, name }
  const findVar = name => { for (let f = frame; f; f = f.parent) if (f.vars.has(name)) return f.vars; return vars.has(name) ? vars : null; };
  const hasVar = name => !!findVar(name);
  const getVar = name => findVar(name).get(name);
  const setVar = (name, v) => (frame ? frame.vars : vars).set(name, v);
  const setUp = (name, v) => { for (let f = frame && frame.parent; f; f = f.parent) if (f.vars.has(name)) return f.vars.set(name, v); vars.set(name, v); };
  const snap = (line, act, extra) => {
    if (steps.length >= LIMIT) throw new RErr(`已經執行超過 ${LIMIT} 步，可能是無限迴圈（或無限遞迴）！`, line, 'inf');
    steps.push({ line, act, x: w.x, y: w.y, dir: w.dir, rot: w.rot, beepers: { ...w.beepers }, picked: w.picked, placed: w.placed,
      vars: [...vars].map(([k, v]) => [k, fmtShort(v)]).concat(frame ? [...frame.vars].map(([k, v]) => [`${k} ⟨${frame.name} 裡⟩`, fmtShort(v)]) : []), ...extra });
  };
  const blocked = d => isBlocked(w, w.x, w.y, d);
  const here = () => w.beepers[`${w.x},${w.y}`] || 0;
  const ROBOT = {
    move(n){
      if (blocked(w.dir)) { snap(n.line, 'bonk', { say: '撞！' }); throw new RErr('撞牆了！前面被擋住，不能 move()。先用 front_is_clear() 檢查看看。', n.line, 'bonk'); }
      const [dx, dy] = DIRS[w.dir]; w.x += dx; w.y += dy; snap(n.line, 'move');
    },
    turn_left(n){ w.dir = (w.dir + 1) % 4; w.rot -= 90; snap(n.line, 'turn'); },
    turn_right(n){ w.dir = (w.dir + 3) % 4; w.rot += 90; snap(n.line, 'turn'); },
    pick_beeper(n){

const HBB_REF = ['A', 'C', 'T', 'C', 'C', 'T', 'G', 'A', 'G', 'G', 'A', 'G'];   // HBB codons 4-7: ACT CCT GAG GAG
function hbbWorld(pid, muts){
  const seq = HBB_REF.map((b, i) => muts[i + 1] || b);
  const labels = [];
  HBB_REF.forEach((b, i) => labels.push([i + 1, 2, b, 'ref']));
  seq.forEach((b, i) => labels.push([i + 1, 1, b, 'base']));
  return { W: 12, H: 2, robot: [1, 1, 0], beepers: {}, walls: [], labels, codons: 3, pid, seq,
    muts: Object.keys(muts).map(Number).sort((a, b) => a - b),
    vars: { ref: [...HBB_REF], patient: new RList(['id', 'gene', 'seq'], [pid, 'HBB', seq]) } };
}

    tests: [[2, 3, 4, 5, 6, 7, 8], [8], [2, 5]].map(xs => corridor(8, gemsAt(xs))),
    describe: d => `寶石在第 ${Object.keys(d.beepers).map(k => k.split(',')[0]).join('、')} 格`,
    check: w => left(w) ? { ok: false, msg: `還有 ${left(w)} 顆寶石沒撿。` } : w.x !== 8 ? { ok: false, msg: '寶石撿完了，但還沒走到最右邊。' } : { ok: true } },

  { id: 'in', tag: '%in%', title: '只放在指定的格子',
    goal: '向量 spots 列出要放寶石的格子編號。從第 2 格走到第 8 格，編號在 spots 裡的格子才放一顆寶石。',
    concept: `<p><code>x %in% v</code> 問的是「x 有沒有出現在向量 v 裡面」，回答 <code>TRUE</code> 或 <code>FALSE</code>：</p>
      <p><code>5 %in% c(2, 5, 7)</code> → <code>TRUE</code>　　<code>4 %in% c(2, 5, 7)</code> → <code>FALSE</code></p>
      <p>別跟 for 的 <code>in</code> 搞混：<code>for (i in 2:8)</code> 的 <code>in</code> 是「讓 i 依序取出每個值」；<code>%in%</code> 前後有百分號，是「是否屬於」的判斷，常放在 for 迴圈裡的 <code>if</code> 條件中。</p>
      <p>左邊放向量也可以，會逐一判斷：<code>c(1, 5) %in% c(2, 5, 7)</code> → <code>[1] FALSE  TRUE</code>。要問「不在裡面」就寫 <code>!(i %in% spots)</code>。</p>`,
    starter: 'spots <- c(2, 5, 7)\nfor (i in 2:8) {\n  move()          # 現在 R 寶站在第 i 格\n  # i 在 spots 裡面，才放寶石\n  \n}\n',
    hint: '在空白那行寫 <code>if (i %in% spots) put_beeper()</code>。執行時看 Environment 裡的 i，和對話框裡的 TRUE / FALSE。',
    solution: 'spots <- c(2, 5, 7)\nfor (i in 2:8) {\n  move()\n  if (i %in% spots) put_beeper()\n}\n', par: 4, req: [['for', 1], ['%in%', 1, '%in%']],
    def: () => corridor(8, {}, { targets: [[2, 1, 1], [5, 1, 1], [7, 1, 1]] }),
    check: w => {
      for (let x = 1; x <= 8; x++) {
        const n = w.beepers[`${x},1`] || 0, want = [2, 5, 7].includes(x) ? 1 : 0;
        if (n !== want) return { ok: false, msg: want ? `第 ${x} 格在 spots 裡，應該放 1 顆，現在有 ${n} 顆。` : `第 ${x} 格不在 spots 裡，不應該放寶石。` };
      }
      return { ok: true };
    } },

  { id: 'sweep', tag: 'while+if', title: '清掃走廊',
    goal: '長度和寶石位置都不固定。走到牆邊，把每一格（包括第一格和最後一格）的寶石都撿起來。',
    concept: `<p>把 while 和 if 組合起來：一路往前走，每到一格就檢查要不要撿。</p>
      <p>小心柵欄問題：while 結束時，R 寶站在最後一格，但那一格還沒檢查過。</p>`,
    starter: 'while (front_is_clear()) {\n  \n}\n',
    hint: '迴圈裡：先檢查腳下有沒有寶石，再 <code>move()</code>。迴圈結束後，最後一格要再檢查一次。',
    solution: 'while (front_is_clear()) {\n  if (beepers_present()) pick_beeper()\n  move()\n}\nif (beepers_present()) pick_beeper()\n', par: 4, req: [['while', 1], ['if', 1]],
    random: true, def: () => { const L = randInt(5, 10); let xs; do { xs = Array.from({ length: L }, (_, i) => i + 1).filter(() => Math.random() < .45); } while (!xs.length); return corridor(L, gemsAt(xs)); },
    tests: [[5, [1, 5]], [8, [1, 2, 3, 4, 5, 6, 7, 8]], [6, [6]], [9, [3]]].map(([L, xs]) => corridor(L, gemsAt(xs))),
    describe: d => `長度 ${d.W}、寶石在第 ${Object.keys(d.beepers).map(k => k.split(',')[0]).join('、')} 格`,
    check: (w, d) => left(w) ? { ok: false, msg: `還有 ${left(w)} 顆寶石沒撿${w.beepers[`${d.W},1`] ? '（最後一格的還在！）' : w.beepers['1,1'] ? '（第一格的還在！）' : ''}。` } : w.x !== d.W ? { ok: false, msg: '還沒走到牆邊。' } : { ok: true } },

  { id: 'and', tag: '&& 而且', title: '先到先停',
    goal: '走廊上「可能」有一顆寶石，也可能沒有。往前走，碰到寶石或碰到牆就停；有寶石就撿起來。',
    concept: `<p><code>A &amp;&amp; B</code>（而且）：兩個條件<b>都是</b> TRUE，結果才是 TRUE。<code>A || B</code>（或者）：<b>只要一個</b>是 TRUE，結果就是 TRUE。</p>
      <p>這關要「前面有路<b>而且</b>腳下沒有寶石」才繼續走，所以寫成 <code>front_is_clear() &amp;&amp; !beepers_present()</code>。任何一個變成 FALSE，迴圈就停。</p>
      <p>例如 <code>TRUE &amp;&amp; FALSE</code> 是 FALSE；<code>TRUE || FALSE</code> 是 TRUE；<code>x %% 3 == 0 &amp;&amp; x %% 5 == 0</code> 判斷 x 是不是 15 的倍數。</p>`,
    starter: '# 前面有路「而且」腳下沒有寶石，才繼續走\nwhile (front_is_clear() ___ !beepers_present()) {\n  move()\n}\nif (beepers_present()) pick_beeper()\n',
    hint: '把 ___ 換成「而且」的符號 <code>&amp;&amp;</code>。',
    solution: 'while (front_is_clear() && !beepers_present()) {\n  move()\n}\nif (beepers_present()) pick_beeper()\n', par: 3, req: [['while', 1], ['&&', 1, '&&']],
    random: true, def: () => { const L = randInt(5, 10); return corridor(L, Math.random() < .65 ? gemsAt([randInt(2, L)]) : {}); },
    tests: [[6, [3]], [7, []], [5, [5]], [9, [2]]].map(([L, xs]) => corridor(L, gemsAt(xs))),
    describe: d => `長度 ${d.W}、${Object.keys(d.beepers).length ? `寶石在第 ${Object.keys(d.beepers)[0].split(',')[0]} 格` : '沒有寶石'}`,
    check: (w, d) => {
      const g = Object.keys(d.beepers)[0];
      if (g) { const gx = Number(g.split(',')[0]); return w.picked < 1 ? { ok: false, msg: `寶石在第 ${gx} 格，還沒撿到。` } : w.x !== gx ? { ok: false, msg: '撿到寶石後就要停下來。' } : { ok: true }; }
      return w.x !== d.W ? { ok: false, msg: '這張地圖沒有寶石，要一路走到牆邊才停。' } : { ok: true };
    } },

  { id: 'break', tag: 'break', title: '找到就收工',
    goal: '寶石藏在某一格。用 for 迴圈往前走，一找到寶石就用 break 提早離開迴圈，然後撿起來。',
    concept: `<p><code>break</code> 會<b>立刻結束整個迴圈</b>，剩下的圈數都不跑了，直接跳到迴圈後面的程式。</p>
      <p>寫在巢狀迴圈裡時，break 只跳出離它最近的那一層。下一關會介紹 <code>repeat</code>：一種沒有條件、一定要靠 break 才能離開的迴圈。</p>`,
    starter: 'for (i in 1:9) {\n  move()\n  if (beepers_present()) {\n    # 找到了！提早離開迴圈\n    \n  }\n}\npick_beeper()\n',
    hint: '在空白那行寫 <code>break</code>。執行時注意看 Environment 裡的 i：break 之後 i 就不再增加。',
    solution: 'for (i in 1:9) {\n  move()\n  if (beepers_present()) {\n    break\n  }\n}\npick_beeper()\n', par: 5, req: [['for', 1], ['break', 1]],
    random: true, def: () => corridor(10, gemsAt([randInt(2, 9)])),
    tests: [2, 5, 10].map(x => corridor(10, gemsAt([x]))),
    describe: d => `寶石在第 ${Object.keys(d.beepers)[0].split(',')[0]} 格`,
    check: w => w.picked >= 1 ? { ok: true } : { ok: false, msg: '還沒撿到寶石。' } },

  { id: 'repeat', tag: 'repeat', title: '一路種到牆邊',
    goal: '走廊長度每次都不一樣。用 repeat 迴圈在<b>每一格</b>（包括第一格和最後一格）都放一顆寶石。',
    concept: `<p><code>repeat { … }</code> 會<b>無條件一直重複</b>，它本身沒有條件，所以一定要在裡面放 <code>if (…) break</code> 才停得下來，不然就是無限迴圈。</p>
      <p>三種迴圈的差別在「什麼時候檢查」：</p>
      <p>• <code>for (i in 1:n)</code>：次數事先知道。<br>• <code>while (條件)</code>：每一圈<b>開始前</b>先檢查。<br>• <code>repeat</code> ＋ <code>break</code>：檢查放在<b>任何你想要的位置</b>，常放在中間或最後。</p>
      <p>這關的重點：每一格都要放，但最後一格不能再 move()。用 while 會遇到柵欄問題（最後一格要在迴圈外再補一次）；用 repeat 可以把「檢查」放在中間，一個迴圈就處理完所有格子。例如：</p>
      <pre class="snippet">x &lt;- 1
repeat {
  cat(x, "")            # 先做事
  if (x &gt;= 8) break     # 再檢查：夠大了就離開
  x &lt;- x * 2            # 還沒就繼續
}
# 印出 1 2 4 8</pre>
      <p>換成 R 寶：每一格都要「放 → 檢查到牆邊了沒 → 走」，順序要排對。</p>`,
    starter: 'repeat {\n  # ① 放寶石\n\n  # ② 前面被擋住了就 break\n\n  # ③ 往前走\n\n}\n',
    hint: '照著說明的順序：<code>put_beeper()</code>、<code>if (front_is_blocked()) break</code>、<code>move()</code>。順序換了會怎樣？試試看把 move() 放到 break 前面。',
    solution: 'repeat {\n  put_beeper()\n  if (front_is_blocked()) break\n  move()\n}\n', par: 4, req: [['repeat', 1], ['break', 1]],
    random: true, def: () => { const L = randInt(4, 10); return corridor(L, {}, { targets: Array.from({ length: L }, (_, i) => [i + 1, 1, 1]) }); },
    tests: [1, 4, 9].map(L => corridor(L, {})),
    describe: d => `長度 ${d.W} 的走廊`,
    check: (w, d) => {
      for (let x = 1; x <= d.W; x++) {
        const n = w.beepers[`${x},1`] || 0;
        if (n === 0) return { ok: false, msg: x === d.W ? `最後一格（第 ${x} 格）還是空的！想想看：put_beeper() 和 break 的順序。` : `第 ${x} 格還是空的。` };
        if (n > 1) return { ok: false, msg: `第 ${x} 格放了 ${n} 顆，每格只要 1 顆。` };
      }
      return { ok: true };
    } },

  { id: 'next', tag: 'next', title: '補滿空格',
    goal: '第 2 到第 8 格裡，有些已經有寶石了。把空的格子補上一顆，已經有的就跳過。',
    concept: `<p><code>next</code> 會<b>跳過這一圈剩下的程式</b>，直接進入下一圈。迴圈不會結束，只是這一圈提早收工。</p>
      <p>Python、C、Java 裡叫做 <code>continue</code>，R 裡叫做 <code>next</code>。（R 沒有 continue，寫了會出錯。）</p>
      <p>比較：<code>break</code> 是整個迴圈結束；<code>next</code> 只跳過這一圈。</p>`,
    starter: 'for (i in 1:7) {\n  move()\n  # 已經有寶石，就跳過這一圈\n  if (beepers_present()) ___\n  put_beeper()\n}\n',
    hint: '把 ___ 換成 <code>next</code>：有寶石就不要執行下面的 <code>put_beeper()</code>。',
    solution: 'for (i in 1:7) {\n  move()\n  if (beepers_present()) next\n  put_beeper()\n}\n', par: 4, req: [['for', 1], ['next', 1]],
    random: true, def: () => corridor(8, gemsAt([2, 3, 4, 5, 6, 7, 8].filter(() => Math.random() < .45)), { targets: [2, 3, 4, 5, 6, 7, 8].map(x => [x, 1, 1]) }),
    tests: [[], [2, 3, 4, 5, 6, 7, 8], [3, 5, 8]].map(xs => corridor(8, gemsAt(xs))),
    describe: d => Object.keys(d.beepers).length ? `原本寶石在第 ${Object.keys(d.beepers).map(k => k.split(',')[0]).join('、')} 格` : '一開始沒有寶石',
    check: w => {
      for (let x = 1; x <= 8; x++) {
        const n = w.beepers[`${x},1`] || 0, want = x === 1 ? 0 : 1;
        if (n !== want) return { ok: false, msg: `第 ${x} 格應該有 ${want} 顆，現在有 ${n} 顆${n > 1 ? '（已經有寶石的格子要用 next 跳過）' : ''}。` };
      }
      return { ok: true };
    } },

  { id: 'square', tag: '巢狀', title: '繞場一圈',
    goal: '沿著場地邊緣走一整圈，撿起三個角落的寶石，最後回到起點。',
    concept: `<p>迴圈裡面再放一個迴圈，就是巢狀迴圈。外層跑 4 次（4 個邊），外層每跑一次，內層就從頭完整跑一遍（每邊走好幾步）。</p>
      <p>內層的 <code>move()</code> 總共會執行「外層次數 × 內層次數」次。</p>`,
    starter: 'for (side in 1:4) {\n  for (step in 1:___) {\n    move()\n  }\n  if (beepers_present()) pick_beeper()\n  turn_left()\n}\n',
    hint: '場地是 5 × 5，從一個角走到下一個角要幾步？',
    solution: 'for (side in 1:4) {\n  for (step in 1:4) {\n    move()\n  }\n  if (beepers_present()) pick_beeper()\n  turn_left()\n}\n', par: 5, req: [['for', 2, '巢狀的 for（for 裡面再放 for）']],
    def: () => ({ W: 5, H: 5, robot: [1, 1, 0], beepers: { '5,1': 1, '5,5': 1, '1,5': 1 }, walls: [[2, 2, 'N'], [3, 2, 'N'], [4, 2, 'N'], [2, 4, 'E'], [3, 3, 'E'], [2, 2, 'E']] }),
    check: w => left(w) ? { ok: false, msg: `還有 ${left(w)} 顆寶石沒撿。` } : (w.x !== 1 || w.y !== 1) ? { ok: false, msg: '寶石撿完了，但 R 寶沒有回到起點。' } : { ok: true } },

  { id: 'pyramid', tag: '巢狀', title: '寶石金字塔',
    goal: '第 1 格放 1 顆、第 2 格放 2 顆……第 5 格放 5 顆。',
    concept: `<p>內層的次數可以用外層的變數！寫成 <code>for (k in 1:i)</code>：外層 i = 1 時內層跑 1 次，i = 2 時跑 2 次……</p>
      <p>這樣的巢狀迴圈常用來畫三角形、處理「上三角矩陣」。</p>`,
    starter: 'for (i in 1:5) {\n  # 在這一格放 i 顆寶石\n  for (k in 1:___) {\n    put_beeper()\n  }\n  move()\n}\n',
    hint: '內層要跑的次數不是固定的數字，而是外層變數 <code>i</code>。',
    solution: 'for (i in 1:5) {\n  for (k in 1:i) {\n    put_beeper()\n  }\n  move()\n}\n', par: 4, req: [['for', 2, '巢狀的 for（for 裡面再放 for）']],
    def: () => corridor(6, {}, { targets: [1, 2, 3, 4, 5].map(x => [x, 1, x]) }),
    check: w => {
      for (let x = 1; x <= 6; x++) {
        const n = w.beepers[`${x},1`] || 0, want = x <= 5 ? x : 0;
        if (n !== want) return { ok: false, msg: `第 ${x} 格應該有 ${want} 顆，現在有 ${n} 顆。` };
      }
      return { ok: true };
    } },

  { id: 'ifelse', tag: 'ifelse', title: '照著地圖放',
    goal: '向量 heights 是 5 格的高度。高度大於 5 的格子放 2 顆寶石，其他格子放 1 顆。',
    concept: `<p><code>if</code> 一次只能判斷<b>一個</b>值。寫 <code>if (heights &gt; 5)</code> 會出錯：<code>the condition has length &gt; 1</code>，因為 heights 有 5 個值。</p>
      <p><code>ifelse(條件, 是的話, 不是的話)</code> 會對向量的<b>每一個元素</b>分別判斷，回傳一樣長的向量：</p>
      <p><code>ifelse(c(3, 8, 1) &gt; 5, "高", "低")</code> → <code>[1] "低" "高" "低"</code></p>
      <p><code>n[i]</code> 會取出向量 n 的第 i 個值（R 從 1 開始數）。</p>`,
    starter: 'heights <- c(3, 8, 1, 9, 4)\n# 高度大於 5 放 2 顆，否則放 1 顆\nn <- ifelse(___, 2, 1)\nprint(n)\nfor (i in 1:5) {\n  for (k in 1:n[i]) {\n    put_beeper()\n  }\n  move()\n}\n',
    hint: '條件是 <code>heights &gt; 5</code>。執行後看 Console 印出的 n，再看 Environment。',
    solution: 'heights <- c(3, 8, 1, 9, 4)\nn <- ifelse(heights > 5, 2, 1)\nfor (i in 1:5) {\n  for (k in 1:n[i]) {\n    put_beeper()\n  }\n  move()\n}\n', par: 7, req: [['ifelse', 1, 'ifelse()']],
    def: () => corridor(6, {}, { targets: [[1, 1, 1], [2, 1, 2], [3, 1, 1], [4, 1, 2], [5, 1, 1]] }),
    check: w => {
      const want = [1, 2, 1, 2, 1, 0];
      for (let x = 1; x <= 6; x++) {
        const n = w.beepers[`${x},1`] || 0;
        if (n !== want[x - 1]) return { ok: false, msg: `第 ${x} 格應該有 ${want[x - 1]} 顆，現在有 ${n} 顆。` };
      }
      return { ok: true };
    } },

  { id: 'maze', tag: '綜合', title: '迷宮',
    goal: '找到迷宮裡的寶石並撿起來。',
    concept: `<p><b>右手扶牆法</b>：右邊有路就右轉走過去；不然前面有路就直走；兩邊都不通就左轉。用 while 一直重複，直到腳下有寶石為止。</p>
      <p><code>if … else if … else</code> 由上往下檢查，只會執行第一個成立的分支。<code>no_beepers_present()</code> 和 <code>!beepers_present()</code> 意思一樣。</p>`,
    starter: '# 右手扶牆法：一直走，直到腳下有寶石\nwhile (no_beepers_present()) {\n  if (right_is_clear()) {\n    turn_right()\n    move()\n  } else if (___) {\n    move()\n  } else {\n    turn_left()\n  }\n}\npick_beeper()\n',
    hint: 'else if 要檢查的是「前面有沒有路」。',
    solution: 'while (no_beepers_present()) {\n  if (right_is_clear()) {\n    turn_right()\n    move()\n  } else if (front_is_clear()) {\n    move()\n  } else {\n    turn_left()\n  }\n}\npick_beeper()\n', par: 9, req: [['while', 1], ['if', 1]],
    def: () => ({ W: 5, H: 5, robot: [1, 1, 0], beepers: { '5,5': 1 }, walls: MAZE }),
    check: w => w.picked >= 1 ? { ok: true } : { ok: false, msg: '還沒撿到寶石。' } },

  { id: 'boss', tag: '大魔王', title: '寶石倉庫大清倉', boss: true, xp: 150, pass: 'ycc0901',
    goal: '倉庫的大小、寶石的位置和數量每次都不一樣，一格還可能疊好幾顆。把倉庫裡的寶石全部撿光，用變數 total 記下一共撿了幾顆，最後在 R 寶停下來的那一格，把 total 顆寶石全部放下，堆成一堆。',
    concept: `<p>這關沒有新語法，要把前面學過的全部組合起來（外層和內層都可以用 <code>repeat</code> ＋ <code>break</code>，就像「一路種到牆邊」那關）。先拆成三個小問題：</p>
      <p><b>① 掃一列：</b>一路往前走，每到一格就把寶石撿<b>光</b>。一格可能有好幾顆，所以用 <code>while (beepers_present())</code>，不是 <code>if</code>。每撿一顆就 <code>total &lt;- total + 1</code>。</p>
      <p><b>② 換列（蛇行）：</b>往東掃完，左轉、上樓、再左轉，變成往西掃；往西掃完就右轉、上樓、右轉。用 <code>facing_east()</code> 判斷現在朝哪邊；上面沒有路了就 <code>break</code>。</p>
      <p><b>③ 放回去：</b>重複 total 次 <code>put_beeper()</code>。</p>
      <p>過關後，大魔王還會用這些倉庫測試你：<b>一格疊了 3 顆</b>、<b>只有一列</b>、<b>只有一行</b>、<b>完全沒有寶石</b>。（提示：total 是 0 的時候，<code>1:total</code> 會變成什麼？）</p>`,
    starter: '# 大魔王：寶石倉庫大清倉\ntotal <- 0\n\nrepeat {\n  # ① 掃這一列：每一格把寶石撿光，順便數 total\n\n  # ② 換到上一列（往東和往西要轉不同方向）；沒有上一列就 break\n\n}\n\n# ③ 把 total 顆寶石放在現在這一格\n\n',
    hint: '外層用 <code>repeat</code> 一列一列處理；裡面再放一個 <code>repeat</code> 掃這一列：先 <code>while (beepers_present())</code> 撿光，<code>if (front_is_blocked()) break</code>，再 <code>move()</code>。換列時：<code>if (facing_east())</code> 就檢查 <code>left_is_blocked()</code>，否則檢查 <code>right_is_blocked()</code>。最後用 <code>for (k in seq_len(total))</code>，不要用 <code>1:total</code>。',
    solution: 'total <- 0\nrepeat {\n  # ① 掃這一列\n  repeat {\n    while (beepers_present()) {\n      pick_beeper()\n      total <- total + 1\n    }\n    if (front_is_blocked()) break\n    move()\n  }\n  # ② 換到上一列\n  if (facing_east()) {\n    if (left_is_blocked()) break\n    turn_left()\n    move()\n    turn_left()\n  } else {\n    if (right_is_blocked()) break\n    turn_right()\n    move()\n    turn_right()\n  }\n}\n# ③ 放回去（total 可能是 0）\nfor (k in seq_len(total)) put_beeper()\n',
    par: 19, req: [],
    random: true, def: () => {
      const W = randInt(4, 7), H = randInt(2, 4), b = {};
      for (let x = 1; x <= W; x++) for (let y = 1; y <= H; y++) if (Math.random() < .35) b[`${x},${y}`] = randInt(1, 3);
      return { W, H, robot: [1, 1, 0], beepers: b, walls: [] };
    },
    tests: [
      { W: 6, H: 3, robot: [1, 1, 0], beepers: { '1,1': 2, '6,1': 1, '3,2': 1, '6,2': 3, '1,3': 1, '6,3': 2 }, walls: [] },
      { W: 5, H: 4, robot: [1, 1, 0], beepers: { '5,4': 2, '1,4': 1, '2,2': 3 }, walls: [] },
      { W: 7, H: 1, robot: [1, 1, 0], beepers: { '1,1': 1, '7,1': 3 }, walls: [] },
      { W: 1, H: 4, robot: [1, 1, 0], beepers: { '1,2': 1, '1,4': 2 }, walls: [] },
      { W: 4, H: 3, robot: [1, 1, 0], beepers: {}, walls: [] },
    ],
    describe: d => { const t = Object.values(d.beepers).reduce((a, b) => a + b, 0); return `${d.W} × ${d.H} 的倉庫、共 ${t} 顆寶石${t ? '' : '（空倉庫）'}`; },
    check: (w, d) => {
      const total = Object.values(d.beepers).reduce((a, b) => a + b, 0);
      const piles = Object.entries(w.beepers), here = w.beepers[`${w.x},${w.y}`] || 0;
      if (w.picked < total) return { ok: false, msg: `倉庫裡原本有 ${total} 顆寶石，你只撿了 ${w.picked} 顆。是不是有一列沒掃到，或一格只撿了一顆？` };
      if (!total && piles.length) return { ok: false, msg: `空倉庫的 total 是 0，不該放任何寶石，你卻放了 ${left(w)} 顆。1:0 是 c(1, 0)，會跑 2 圈！改用 seq_len(total)。` };
      if (piles.length > 1) return { ok: false, msg: `寶石要全部堆在同一格，現在分散在 ${piles.length} 格。` };
      if (total && !here) return { ok: false, msg: '寶石要堆在 R 寶最後停下來的那一格。' };
      if (here !== total) return { ok: false, msg: `那一堆有 ${here} 顆，應該是 ${total} 顆（你撿到的總數）。` };
      return { ok: true };
    } },
  { id: 'hbb', tag: '生資實戰', title: 'HBB 基因突變篩檢', bio: true, xp: 150,
    goal: '病人的 HBB 基因序列放在 list <code>patient</code> 裡，參考序列是 vector <code>ref</code>（都已經在 Environment 了）。R 寶沿著病人序列走，鹼基和 ref 不一樣的格子放一顆寶石，同時把位置收集到 vector <code>pos</code>；最後用 <code>hbs</code> 記下第 8 個鹼基有沒有突變（TRUE / FALSE）。',
    goalHtml: true,
    concept: `<p><b>生物背景：</b>HBB 基因負責製造血紅素的 β 鏈。第 6 個密碼子 <code>GAG</code>（麩胺酸）只要中間的 A 變成 T，變成 <code>GTG</code>（纈胺酸），就會造成<b>鐮刀型貧血（HbS）</b>。地圖上的 12 個鹼基是第 4–7 個密碼子，第 6 個密碼子中間那個鹼基就是第 <b>8</b> 格。上排灰色是 ref，下排是病人。</p>
      <p><b>資料結構（第一單元學過的）：</b></p>
      <p>• <code>patient</code> 是 <b>list</b>：<code>list(id = "P07", gene = "HBB", seq = c("A", "C", …))</code>。用 <code>patient$seq</code> 或 <code>patient[["seq"]]</code> 打開盒子拿出序列，再用 <code>[i]</code> 拿第 i 個鹼基：<code>patient$seq[i]</code>。</p>
      <p>• 小心：<code>patient["seq"]</code> 拿到的還是一個 list（盒子），不能直接拿來比較。<b>[ ] 拿盒子，[[ ]] 打開盒子。</b></p>
      <p>• <code>pos &lt;- c()</code> 先建一個空的 vector，找到突變就 <code>pos &lt;- c(pos, i)</code> 接在後面（每次都會產生一個新的 vector）。</p>
      <p>• 最後 <code>8 %in% pos</code> 回答「第 8 個位置在不在突變清單裡」。</p>`,
    starter: '# 生資實戰：HBB 基因篩檢\n# Environment 已經有：ref（參考序列）、patient（list：id、gene、seq）\npatient$id\npos <- c()          # 空的 vector，用來收集突變位置\nfor (i in seq_along(ref)) {\n  # 病人第 i 個鹼基和 ref[i] 不一樣 → 放寶石，並把 i 加進 pos\n\n  if (i < length(ref)) move()\n}\nhbs <- ___          # 第 8 個位置有突變嗎？\ncat(patient$id, "突變位置：", pos, "\\n")\ncat("HbS 鐮刀型貧血：", hbs, "\\n")\n',
    hint: '比較寫成 <code>if (patient$seq[i] != ref[i]) { put_beeper(); pos &lt;- c(pos, i) }</code>（大括號裡分兩行寫）。最後 <code>hbs &lt;- 8 %in% pos</code>。',
    solution: 'pos <- c()\nfor (i in seq_along(ref)) {\n  if (patient$seq[i] != ref[i]) {\n    put_beeper()\n    pos <- c(pos, i)\n  }\n  if (i < length(ref)) move()\n}\nhbs <- 8 %in% pos\ncat(patient$id, "突變位置：", pos, "\\n")\ncat("HbS 鐮刀型貧血：", hbs, "\\n")\n',
    par: 10, req: [['for', 1], ['%in%', 1, '%in%']],
    random: true, def: () => {
      const muts = {};
      if (Math.random() < .5) muts[8] = 'T';
      const k = randInt(0, 2);
      for (let j = 0; j < k; j++) { const q = randInt(1, 12); if (!muts[q]) muts[q] = HBB_REF[q - 1] === 'A' ? 'G' : 'A'; }
      return hbbWorld(`P${String(randInt(1, 99)).padStart(2, '0')}`, muts);
    },
    tests: [hbbWorld('P01', {}), hbbWorld('P02', { 8: 'T' }), hbbWorld('P03', { 7: 'A' }), hbbWorld('P04', { 1: 'G', 8: 'T', 12: 'C' })],
    describe: d => { const m = d.muts; return `病人 ${d.pid}：${m.length ? `第 ${m.join('、')} 個鹼基突變` : '沒有突變'}`; },
    check: (w, d, t) => {
      for (let x = 1; x <= 12; x++) {
        const n = w.beepers[`${x},1`] || 0, want = d.muts.includes(x) ? 1 : 0;
        if (n !== want) return { ok: false, msg: want ? `第 ${x} 個鹼基 ref 是 ${HBB_REF[x - 1]}、病人是 ${d.seq[x - 1]}，是突變，應該放 1 顆寶石。` : n > 1 ? `第 ${x} 格放了 ${n} 顆，每個突變只要 1 顆。` : `第 ${x} 個鹼基兩邊都是 ${HBB_REF[x - 1]}，沒有突變，不應該放寶石。` };
      }
      const V = t && t.vars;
      if (!V || !V.has('pos')) return { ok: false, msg: '找不到變數 pos：記得用 pos <- c() 建立，再用 pos <- c(pos, i) 收集突變位置。' };
      const pos = asVec(V.get('pos')).map(Number);
      if (pos.join(',') !== d.muts.join(',')) return { ok: false, msg: `pos 應該是 ${d.muts.length ? `c(${d.muts.join(', ')})` : '空的（NULL）'}，你的是 ${fmtShort(V.get('pos'))}。` };
      if (!V.has('hbs')) return { ok: false, msg: '找不到變數 hbs：用 hbs <- 8 %in% pos 記下第 8 個位置有沒有突變。' };
      const want = d.muts.includes(8), got = asVec(V.get('hbs'));
      if (got.length !== 1 || got[0] !== want) return { ok: false, msg: `這位病人第 8 個鹼基${want ? '有' : '沒有'}突變，hbs 應該是 ${want ? 'TRUE' : 'FALSE'}，你的是 ${fmtShort(V.get('hbs'))}。` };
      return { ok: true };
    } },
];
LEVELS.forEach((l, i) => l.n = i + 1);
</script>

<script>
/* ================= UI ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const HL_KW = /^(for|while|if|else|in|next|break|repeat|function|TRUE|FALSE|NULL)$/;
function hl(src){
  const re = /(#.*$)|("[^"]*")|(\b\d+(?:\.\d+)?\b)|(%in%|<-|%%|==|<=|>=|!=|&&|\|\|)|([A-Za-z_.][\w.]*)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1]) out += `<span class="t-com">${t}</span>`;
    else if (m[2]) out += `<span class="t-str">${t}</span>`;
    else if (m[3]) out += `<span class="t-num">${t}</span>`;
    else if (m[4]) out += `<span class="t-op">${t}</span>`;
    else if (HL_KW.test(m[0])) out += `<span class="t-kw">${t}</span>`;
    else if (src[re.lastIndex] === '(') out += `<span class="t-fn">${t}</span>`;
    else out += t;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

/* ---------- progress ---------- */
const KEY = 'r-loop-karel-v2';
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const S = Object.assign({ xp: 0, stars: {}, codes: {}, fails: {}, cur: 'seq', sound: true, bossBest: 0, awarded: {} }, load());

/* ---------- sound + fx ---------- */
let AC = null;
function tone(f, d = .08, type = 'sine', vol = .05, when = 0){
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const SFX = {
  move: () => tone(420 + Math.random() * 60, .05, 'triangle', .035),
  turn: () => tone(700, .06, 'sine', .03),
  check: () => tone(880, .03, 'sine', .015),
  pick: () => { tone(880, .08, 'triangle', .05); tone(1320, .12, 'triangle', .05, .07); },
  put: () => tone(330, .09, 'triangle', .05),
  bonk: () => tone(120, .25, 'sawtooth', .05),
  fail: () => { tone(300, .15, 'square', .03); tone(200, .25, 'square', .03, .14); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'triangle', .05, i * .11)),
};
function confetti(el, n = 36){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--accent', '--amber', '--ok', '--gem', '--bad'].map(v => cs.getPropertyValue(v));
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i'); s.className = 'confetti';
    const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 160;
    s.style.cssText = `left:${cx}px;top:${cy}px;background:${cols[i % cols.length]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d + 80}px;--r:${Math.random() * 720 - 360}deg`;
    document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
}
function toast(msg, gold){
  const t = document.createElement('div'); t.className = 'toast' + (gold ? ' gold' : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2400);
}
function gain(amt, label, gold){ S.xp += amt; save(); toast(`+${amt} XP · ${label}`, gold); renderHeader(); }

/* ---------- header + map ---------- */
const NODES = [...LEVELS.map(l => ({ id: l.id, n: l.n, tag: l.tag, boss: l.boss, bio: l.bio })), { id: 'quiz', tag: '預測挑戰' }];
const starCount = id => (S.stars[id] || []).filter(Boolean).length;
function renderHeader(){
  $('#lv').textContent = `Lv.${Math.floor(S.xp / 100) + 1}`;
  $('#xpfill').style.width = `${S.xp % 100}%`;
  $('#xptxt').textContent = `${S.xp} XP`;
  $('#soundBtn').textContent = `音效：${S.sound ? '開' : '關'}`;
  $('#map').innerHTML = NODES.map(n => {
    const st = S.stars[n.id] || [], done = n.id === 'quiz' ? S.bossBest >= 6 : !!st[0];
    const stars = n.id === 'quiz' ? `<span class="stars">${S.bossBest ? `最佳 ${S.bossBest}/8` : '&nbsp;'}</span>`
      : `<span class="stars">${[0, 1, 2].map(i => `<span class="${st[i] ? 'on' : ''}">★</span>`).join('')}</span>`;
    return `<li><button type="button" class="node ${done ? 'done' : ''} ${n.boss ? 'lv-boss' : ''} ${n.bio ? 'bio' : ''}" data-id="${n.id}" aria-current="${String(S.cur) === String(n.id)}">
      <span class="num">${n.bio ? '🧬' : n.boss ? (done ? '👑' : '💀') : done ? '✓' : n.id === 'quiz' ? '?' : n.n}</span><span class="tag">${n.tag}</span>${stars}</button></li>`;
  }).join('');
}
$('#map').addEventListener('click', e => { const b = e.target.closest('.node'); if (b) go(b.dataset.id); });
$('#soundBtn').onclick = () => { S.sound = !S.sound; save(); renderHeader(); if (S.sound) SFX.pick(); };

/* ---------- world rendering ---------- */
const CELL = 100;
const gemShape = (cx, cy, s, cls = '') => `<polygon class="${cls}" points="${cx},${cy - s} ${cx + s * .82},${cy} ${cx},${cy + s} ${cx - s * .82},${cy}" fill="var(--gem)" stroke="var(--gem-edge)" stroke-width="4" stroke-linejoin="round"/>`;
const ROBOT_SVG = `<svg class="rb-svg" viewBox="-50 -50 100 100" aria-hidden="true">
  <g><ellipse class="ft f1 rb-foot" cx="-4" cy="-31" rx="14" ry="8"/><ellipse class="ft f2 rb-foot" cx="-4" cy="31" rx="14" ry="8"/></g>
  <rect class="rb-body" x="-33" y="-30" width="64" height="60" rx="20"/>
  <circle class="rb-ant" cx="-20" cy="0" r="7"/>
  <rect class="rb-face" x="2" y="-22" width="24" height="44" rx="11"/>
  <g class="rb-eyes"><circle class="rb-eye" cx="15" cy="-10" r="5.5"/><circle class="rb-eye" cx="15" cy="10" r="5.5"/></g>
</svg>`;
const BASE_COL = { A: 'var(--ok)', T: 'var(--bad)', G: 'var(--amber)', C: 'var(--accent)' };
// base letters sit above the robot so the current base stays readable
function labelLayer(def){
  let s = '';
  for (const [x, y, b, cls] of def.labels || []) {
    const px = (x - 1) * CELL, py = (def.H - y) * CELL;
    if (cls === 'ref') {
      s += `<text x="${px + 50}" y="${py + 64}" text-anchor="middle" font-size="44" font-weight="800" font-family="JetBrains Mono, monospace" fill="var(--muted)" opacity=".8">${b}</text>`;
      if (x === 1) s += `<text x="${px + 8}" y="${py + 20}" font-size="15" font-family="JetBrains Mono, monospace" fill="var(--muted)">ref</text>`;
    } else {
      s += `<text x="${px + 20}" y="${py + 34}" text-anchor="middle" font-size="34" font-weight="800" font-family="JetBrains Mono, monospace" fill="${BASE_COL[b] || 'var(--ink)'}" stroke="var(--panel)" stroke-width="5" paint-order="stroke">${b}</text>`;
      s += `<text x="${px + 88}" y="${py + 94}" text-anchor="middle" font-size="15" font-family="JetBrains Mono, monospace" fill="var(--muted)">${x}</text>`;
    }
  }
  return s;
}
function staticLayer(def){
  const { W, H } = def; let s = '';
  for (let x = 1; x <= W; x++) for (let y = 1; y <= H; y++) {
    const px = (x - 1) * CELL, py = (H - y) * CELL;
    s += `<rect x="${px}" y="${py}" width="${CELL}" height="${CELL}" fill="${(x + y) % 2 ? 'var(--tile)' : 'var(--tile2)'}"/>`;
    s += `<circle cx="${px + 50}" cy="${py + 50}" r="4" fill="var(--dot)"/>`;
  }
  for (const [x, y, n] of def.targets || []) {
    const cx = (x - 1) * CELL + 50, cy = (H - y) * CELL + 50;
    s += `<polygon points="${cx},${cy - 24} ${cx + 20},${cy} ${cx},${cy + 24} ${cx - 20},${cy}" fill="none" stroke="var(--target)" stroke-width="3" stroke-dasharray="6 5"/>`;
    s += `<text x="${cx}" y="${cy + 42}" text-anchor="middle" font-size="16" font-family="JetBrains Mono, monospace" fill="var(--target)">×${n}</text>`;
  }
  if (def.codons) for (let x = def.codons; x < W; x += def.codons) s += `<line x1="${x * CELL}" y1="6" x2="${x * CELL}" y2="${H * CELL - 6}" stroke="var(--muted)" stroke-width="3" stroke-dasharray="8 7" opacity=".55"/>`;
  for (const [x, y, side] of def.walls || []) {
    const px = (x - 1) * CELL, py = (H - y) * CELL;
    s += side === 'E' ? `<line x1="${px + CELL}" y1="${py}" x2="${px + CELL}" y2="${py + CELL}" stroke="var(--wall)" stroke-width="9" stroke-linecap="round"/>`
                      : `<line x1="${px}" y1="${py}" x2="${px + CELL}" y2="${py}" stroke="var(--wall)" stroke-width="9" stroke-linecap="round"/>`;
  }
  s += `<rect x="3" y="3" width="${W * CELL - 6}" height="${H * CELL - 6}" fill="none" stroke="var(--wall)" stroke-width="7" rx="4"/>`;
  return s;
}
function gemLayer(beepers, H, st){
  let s = '';
  for (const [k, n] of Object.entries(beepers)) {
    const [x, y] = k.split(',').map(Number), cx = (x - 1) * CELL + 50, cy = (H - y) * CELL + 50;
    const pop = st && st.act === 'put' && st.x === x && st.y === y;
    s += `<g>${gemShape(cx, cy, 20, pop ? 'gem-pop' : '')}`;
    if (n > 1) s += `<circle cx="${cx + 22}" cy="${cy - 22}" r="13" fill="var(--ink)"/><text x="${cx + 22}" y="${cy - 17}" text-anchor="middle" font-size="15" font-weight="700" font-family="JetBrains Mono, monospace" fill="var(--panel)">${n}</text>`;
    s += '</g>';
  }
  if (st && st.act === 'pick') s += gemShape((st.x - 1) * CELL + 50, (H - st.y) * CELL + 50, 20, 'gem-poof');
  return s;
}

/* ---------- level page ---------- */
let L = null;      // current level
const P = { def: null, trace: null, k: -1, timer: null, playing: false, mode: 'edit', out: '' };

function go(id){
  stopPlay();
  S.cur = id; save(); renderHeader();
  if (id === 'quiz') { L = null; return renderBossIntro(); }
  L = LEVELS.find(l => l.id === id) || LEVELS[0];
  const code = S.codes[L.id] ?? L.starter;
  $('#stage').innerHTML = `
  <div class="bench">
    <section class="a-mission mission ${L.boss ? 'lv-boss' : ''} ${L.bio ? 'bio' : ''}">
      <div class="eyebrow">第 ${L.n} 關 · ${L.tag}</div>
      <h2>${L.title}</h2>
      <p class="goal">${L.goal}</p>
      <div class="concept">${L.concept}</div>
      <div class="hint" id="hint" hidden><b>提示：</b>${L.hint}</div>
    </section>
    <div class="a-side col">

          ${[['for', 'for (i in 1:3) {\n  \n}'], ['while', 'while (front_is_clear()) {\n  \n}'], ['repeat', 'repeat {\n  \n  if (front_is_blocked()) break\n}'], ['if', 'if (beepers_present()) {\n  \n}'], ['else', ' else {\n  \n}']].map(([l, s]) => `<button type="button" class="snip ctl" data-s="${esc(s)}">${l}</button>`).join('')}

  setupInfo();

  $('#bRun').onclick = () => startRun(false);
